<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<meta name="theme-color" content="#070a1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --bg-a:rgba(7,10,26,.9);--chip:rgba(255,255,255,.08);--ckb:#4a4a62;--shadow:rgba(0,0,0,.45);
  --bg:#070a1a;--bg2:#0d1226;--card:#121831;--line:#222a48;--txt:#eef0fb;--mut:#959bbd;--dim:#5c6385;
  --acc:#7a7cff;--good:#3ddc97;--warn:#ffb547;--bad:#ff5d6c;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.hidden{display:none!important}
.display{font-family:Fraunces,Georgia,serif;font-weight:700;letter-spacing:-.2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,var(--bg-a));backdrop-filter:blur(10px);padding:14px 16px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:24px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;padding:11px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px}
.chip.on{color:#fff;background:var(--c,var(--acc));border-color:transparent}
.chip .n{opacity:.75;font-weight:500}
.subbar{display:flex;align-items:center;gap:8px;padding:6px 16px 0}
.subbar select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--mut)}
.subbar .count{flex:1;color:var(--dim);font-size:12.5px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 12px;padding:14px 16px calc(110px + var(--safe-b))}
.tile{position:relative;cursor:pointer;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cover{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--bg2),var(--card));box-shadow:0 6px 18px var(--shadow)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-family:Fraunces,Georgia,serif;font-size:14px;color:var(--mut)}
.tile .badge{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;letter-spacing:.3px;text-transform:uppercase}
.tile .rate{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--warn);color:#1a1200}
.tile .own{position:absolute;bottom:9px;right:6px;font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;background:rgba(61,220,151,.9);color:#032}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.6)}
.tile .bar i{display:block;height:100%;background:var(--c,var(--acc))}
.tile .t{margin-top:7px;font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 20px}
.empty .big{font-family:Fraunces,Georgia,serif;font-size:22px;color:var(--txt);margin-bottom:6px}

.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:30;height:56px;padding:0 22px 0 18px;border:0;border-radius:18px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(139,108,255,.45)}
.fab svg{width:22px;height:22px}

/* ---------- sheets / pages ---------- */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:slide .22s ease both}
@keyframes slide{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.page-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-a);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.page-head h2{margin:0;font-size:19px;flex:1}
.wrap{padding:16px;max-width:760px;margin:0 auto}

/* ---------- add ---------- */
.results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.res{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%}
.res img,.res .noimg{width:56px;height:84px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg2)}
.res .rt{font-weight:700;font-size:14.5px;line-height:1.25}
.res .rs{font-size:12.5px;color:var(--mut);margin-top:3px}
.res .in{margin-left:auto;font-size:11px;font-weight:700;color:var(--good);flex:none}
.hint{color:var(--mut);font-size:13px;text-align:center;padding:24px 10px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.link-btn{background:none;border:0;color:var(--acc);font-weight:600;padding:8px;font-size:14px}

/* ---------- detail ---------- */
.hero{position:relative;padding:70px 16px 18px;overflow:hidden}
.hero .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3);opacity:.55;transform:scale(1.1)}
.hero .bg.banner{filter:none;opacity:.45;inset:0;transform:none;height:190px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(11,11,18,.15),var(--bg) 92%)}
.hero-in{position:relative;z-index:2;display:flex;gap:14px;align-items:flex-end;max-width:760px;margin:0 auto}
.hero .cover{width:118px;flex:none;box-shadow:0 14px 34px rgba(0,0,0,.6)}
.hero h2{margin:0;font-size:22px;line-height:1.15}
.hero .alt{color:var(--mut);font-size:12.5px;margin-top:4px}
.back{position:absolute;top:14px;left:14px;z-index:3;color:#fff;background:rgba(0,0,0,.45);border:0;backdrop-filter:blur(6px)}
.more-btn{position:absolute;top:14px;right:14px;z-index:3;color:#fff;background:rgba(0,0,0,.45);border:0;backdrop-filter:blur(6px)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--txt)}
.tag.c{background:var(--c);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.sec h3{margin:0 0 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.sec h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--dim)}
.syn{color:var(--txt);opacity:.9;font-size:14px;white-space:pre-line}
.syn.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px}
.facts div span{display:block;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--c,var(--acc));color:#fff;border-color:transparent}
.rating{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.rating button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--bg2);font-weight:800;font-size:13px;color:var(--mut);padding:0}
.rating button.on{color:#1a1200;border-color:transparent}
.rating-label{margin-top:8px;font-size:13px;color:var(--mut);min-height:18px}
.prog{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--c,var(--acc));border-radius:99px;transition:width .25s}
.prog-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.btn.pri{background:var(--c,var(--acc));border-color:transparent;color:#fff}
.btn.danger{color:var(--bad)}
.num-in{display:flex;align-items:center;gap:8px}
.num-in input{width:90px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:700;text-align:center}

/* checklist */
.seasons{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.seasons button{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut)}
.seasons button.on{background:var(--c,var(--acc));color:#fff;border-color:transparent}
.ep{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-top:1px solid var(--line);user-select:none;-webkit-user-select:none}
.ep:first-child{border-top:0}
.ep .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--ckb);flex:none;display:grid;place-items:center;margin-top:1px}
.ep.done .ck{background:var(--c,var(--acc));border-color:transparent}
.ep.done .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ep .no{font-weight:800;font-size:12.5px;color:var(--mut);min-width:34px;margin-top:3px}
.ep .et{flex:1;font-size:14px}
.ep .ed{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.ep.done .et{color:var(--mut)}
.ep .fl{font-size:10px;font-weight:800;color:var(--warn);border:1px solid rgba(255,181,71,.4);border-radius:5px;padding:0 4px;margin-left:6px}
.list-more{width:100%;margin-top:8px}
.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
.vol{aspect-ratio:3/4;border-radius:8px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--dim);position:relative;padding:0}
.vol small{font-size:9px;font-weight:700;letter-spacing:.3px}
.vol.own{border-color:var(--good);color:var(--txt)}
.vol.read{background:var(--c,var(--acc));color:#fff;border-color:transparent}
.vol.own.read{box-shadow:inset 0 0 0 2px var(--good)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* notes */
.note-new textarea,.field textarea,.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;outline:0}
.note-new textarea{min-height:80px}
.note{border-top:1px solid var(--line);padding:10px 0}
.note .nd{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between}
.note .nd button{background:none;border:0;color:var(--dim);font-size:12px}
.note .nt{white-space:pre-wrap;font-size:14px;margin-top:3px}

/* settings / forms */
.field{margin:12px 0}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:600}
.cat-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-pick button{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px;text-align:left;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-pick button .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cat-pick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg2))}
.prof{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prof:first-of-type{border-top:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--acc);flex:none}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);z-index:100;background:#2a2940;border:1px solid #3a3955;color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:92vw}
.toast button{background:none;border:0;color:var(--acc);font-weight:700}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 22px;max-width:520px;margin:0 auto}
.welcome h1{font-size:34px;margin:0 0 6px}
.welcome p{color:var(--mut);margin:0 0 20px}
.big-btn{width:100%;border:0;border-radius:14px;padding:15px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;margin-top:18px}
.menu{position:absolute;right:14px;top:60px;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:200px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px;font-size:14px}
.menu button+button{border-top:1px solid var(--line)}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.hero .cover{width:150px}}

/* ---------- 3D ring (lazy Susan) ---------- */
.mode-btn{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.mode-btn button{background:var(--card);border:0;padding:9px 10px;color:var(--mut);display:grid;place-items:center}
.mode-btn button.on{background:var(--acc);color:#fff}
.mode-btn svg{width:17px;height:17px}
.ring-wrap{position:relative;padding:6px 0 calc(120px + var(--safe-b));overflow:hidden;touch-action:pan-y}
.ring-glow{position:absolute;left:50%;top:150px;width:520px;height:420px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,var(--gc,#8b6cff) 0%,transparent 70%);opacity:.28;filter:blur(20px);transition:background .5s;pointer-events:none}
.ring-stage{position:relative;height:330px;perspective:900px;perspective-origin:50% 0%;cursor:grab;user-select:none;-webkit-user-select:none}
.ring-stage:active{cursor:grabbing}
.ring{position:absolute;left:50%;top:70px;width:0;height:0;transform-style:preserve-3d}
.rcard{position:absolute;width:140px;height:210px;left:-70px;top:0;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.55);transform-style:preserve-3d;will-change:transform,opacity}
.rcard img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.rcard .ph{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font-family:Fraunces,Georgia,serif;color:var(--mut)}
.rcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 40%);pointer-events:none}
.rcard .rb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.55)}
.rcard .rb i{display:block;height:100%}
.ring-floor{position:absolute;left:50%;top:268px;width:360px;height:60px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.12),transparent);pointer-events:none}
.ring-info{position:relative;text-align:center;padding:4px 22px 0;min-height:150px}
.ring-info .rt{font-family:Fraunces,Georgia,serif;font-size:22px;font-weight:700;line-height:1.2;margin-top:6px}
.ring-info .rs{color:var(--mut);font-size:13px;margin-top:5px}
.ring-info .rk{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#fff}
.ring-info .open{margin-top:14px;border:0;border-radius:12px;padding:11px 22px;font-weight:700;color:#fff}
.ring-hint{text-align:center;color:var(--dim);font-size:12px;margin-top:12px}
.ring-count{text-align:center;color:var(--dim);font-size:12px;margin-top:4px}
@media (prefers-reduced-motion: reduce){.ring-glow{transition:none}}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--bg-a);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--dim);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--txt)}
.nav button.on svg{color:var(--acc)}
.fab{bottom:calc(76px + var(--safe-b))}
.grid{padding-bottom:calc(170px + var(--safe-b))}
.ring-wrap{padding-bottom:calc(150px + var(--safe-b))}
.ghead{grid-column:1/-1;font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:700;margin:10px 0 -4px;display:flex;align-items:baseline;gap:8px}
.ghead small{font-family:Inter,sans-serif;font-size:12px;color:var(--dim);font-weight:600}

/* ---------- continue strip / horizontal rows ---------- */
.strip-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 0}
.strip-h h3{margin:0;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.strip-h span{font-size:12px;color:var(--dim)}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}
.cont{flex:none;width:250px;display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;scroll-snap-align:start;cursor:pointer}
.cont .cover{width:58px;flex:none;border-radius:8px}
.cont .ct{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cont .cs{font-size:12px;color:var(--mut);margin-top:3px}
.cont .prog{height:6px;margin:7px 0 0}
.cont .plus{margin-top:8px;border:0;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:800;color:#fff;background:var(--c)}
.mini{flex:none;width:112px;cursor:pointer;scroll-snap-align:start}
.mini .cover{border-radius:9px}
.mini .t{margin-top:6px;font-size:12.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .s{font-size:11px;color:var(--dim);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- browse ---------- */
.b-filters{padding:0 16px}
.b-label{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin:12px 0 0}
.chips.sm .chip{padding:6px 11px;font-size:12.5px}
.load-more{display:block;margin:4px auto 0;grid-column:1/-1}
.tile .onshelf{position:absolute;bottom:9px;left:6px;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.7);color:var(--good)}
.fy-sec{margin-top:6px}
.fy-sec .why{font-size:12px;color:var(--dim);padding:2px 16px 0}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row .btn{flex:1;min-width:110px;padding:12px}
html,body{overflow-x:hidden}
.subbar{flex-wrap:nowrap}
.subbar select{min-width:0;flex:1 1 0;max-width:160px;text-overflow:ellipsis}
#h-sort{flex:0 1 auto;max-width:120px}
@media (max-width:440px){.subbar .count{display:none}}

/* ---------- light mode ---------- */
[data-theme="light"]{--bg:#f6f5fb;--bg2:#eceaf4;--card:#ffffff;--line:#e2e0ec;--txt:#17162a;--mut:#5d5b75;--dim:#8f8da6;--bg-a:rgba(246,245,251,.92);--chip:rgba(23,22,42,.07);--ckb:#b9b7cc;--shadow:rgba(40,30,90,.18);--acc:#7353f0}
[data-theme="light"] .hero .bg{opacity:.35}
[data-theme="light"] .toast{background:#25243a;border-color:#25243a}
[data-theme="light"] .ring-floor{background:radial-gradient(closest-side,rgba(40,30,90,.18),transparent)}
[data-theme="light"] .ring-glow{opacity:.22}
[data-theme="light"] .fab{box-shadow:0 10px 26px rgba(115,83,240,.35)}

/* ---------- updates / release ---------- */
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.bell.spin svg{animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
.tile .newb{position:absolute;top:30px;left:6px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--bad);color:#fff;letter-spacing:.3px}
.rel-row{font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.rel-row:first-of-type{border-top:0}
.rel-in{font-size:11.5px;font-weight:800;color:var(--c,var(--acc));white-space:nowrap}
.rel-note{font-size:12px;color:var(--dim);margin-top:6px}
.upd{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.upd:first-of-type{border-top:0}
.upd .cover{width:44px;flex:none;border-radius:7px}
.upd .ut{font-weight:700;font-size:14px;line-height:1.25}
.upd .ux{font-size:13px;margin-top:2px}
.upd .us{font-size:11.5px;color:var(--dim);margin-top:2px}
.upd .udot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.prog{position:relative}
.prog .aired{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--acc));opacity:.28;border-radius:99px}
.prog i{position:relative}

/* per-episode notes + movie time */
.ep .nb{background:none;border:0;padding:4px;color:var(--dim);flex:none;opacity:.75}
.ep .nb svg{width:17px;height:17px}
.ep .nb.has{color:var(--c,var(--acc));opacity:1}
.ep .un{display:block;font-size:12px;color:var(--mut);margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.un-edit{padding:4px 0 12px 35px}
.un-edit textarea{width:100%;min-height:70px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;outline:0;resize:vertical}
.time-in{flex-wrap:wrap}
.time-in input{width:52px!important;padding:9px 4px!important}
.time-in span{color:var(--mut);font-size:13px}
.res .why{font-size:12px;color:var(--c,var(--acc));margin-top:4px;line-height:1.3}
.dym{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 6px}
.dym .chip{padding:5px 10px;font-size:12.5px;color:var(--txt)}
#a-dt{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;outline:0;resize:vertical}
.cdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.cdot.big{width:30px;height:30px;border:0;padding:0}
.catrow .cname{background:none;border:0;border-bottom:1px dashed var(--line);padding:2px 0;font-weight:700;width:100%;outline:0}
.catrow .btn{padding:7px 9px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button.on{border-color:var(--txt);box-shadow:0 0 0 2px var(--bg) inset}
.cat-pick button.on{border-color:var(--c)}

.welcome .logo{width:84px;height:84px;border-radius:22px;box-shadow:0 12px 34px rgba(90,110,255,.35);margin-bottom:18px}
.fab{background:linear-gradient(135deg,#5b8cff,#9a7cff)}
</style>

<script>/* ============ DATA SOURCES (all free, no keys) ============ */
const CATS = {
  anime:  {label:"Anime",  color:"#ff5d8f", unit:"episode", units:"episodes", verb:"Watching", done:"Watched"},
  manga:  {label:"Manga",  color:"#ffb547", unit:"chapter", units:"chapters", verb:"Reading",  done:"Read", vols:true},
  manhwa: {label:"Manhwa", color:"#8b6cff", unit:"chapter", units:"chapters", verb:"Reading",  done:"Read", vols:true},
  manhua: {label:"Manhua", color:"#ff7a45", unit:"chapter", units:"chapters", verb:"Reading",  done:"Read", vols:true},
  tv:     {label:"TV Shows",color:"#3fc1ff", unit:"episode", units:"episodes", verb:"Watching", done:"Watched"},
  movie:  {label:"Movies", color:"#ff4d5e", unit:"movie",   units:"",         verb:"Watching", done:"Watched"},
  book:   {label:"Books",  color:"#3ddc97", unit:"page",    units:"pages",    verb:"Reading",  done:"Read", own:true},
};
const COUNTRY = {manga:"JP", manhwa:"KR", manhua:"CN"};

function stripHtml(h){
  if(!h) return "";
  const d = new DOMParser().parseFromString(String(h).replace(/<br\s*\/?>/gi,"\n"), "text/html");
  return (d.body.textContent||"").replace(/\n{3,}/g,"\n\n").replace(/\(Source:[^)]*\)\s*$/i,"").trim();
}
async function getJSON(url, opts={}, ms=15000){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, {...opts, signal: ctl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function jsonp(url, ms=15000){
  return new Promise((res, rej)=>{
    const cb = "_jp"+Date.now()+Math.floor(Math.random()*1e4);
    const s = document.createElement("script");
    const done = (fn,v)=>{ clearTimeout(t); delete window[cb]; s.remove(); fn(v); };
    const t = setTimeout(()=>done(rej, new Error("timeout")), ms);
    window[cb] = d => done(res, d);
    s.onerror = () => done(rej, new Error("load"));
    s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
    document.head.appendChild(s);
  });
}

/* ---------- AniList: anime, manga, manhwa, manhua ---------- */
const AL_FIELDS = `id idMal type format status episodes chapters volumes duration countryOfOrigin
  title{romaji english native} synonyms coverImage{extraLarge large color} bannerImage
  description(asHtml:false) startDate{year} endDate{year} genres averageScore
  studios(isMain:true){nodes{name}} staff(perPage:4,sort:RELEVANCE){edges{role node{name{full}}}}
  nextAiringEpisode{episode}`;
async function anilist(query, variables){
  const d = await getJSON("https://graphql.anilist.co", {
    method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify({query, variables})
  });
  if(d.errors) throw new Error(d.errors[0].message);
  return d.data;
}
function fromAniList(m, cat){
  const authors = (m.staff?.edges||[]).filter(e=>/story|art|original/i.test(e.role||"")).map(e=>e.node.name.full);
  const eng = m.title.english, rom = m.title.romaji;
  return {
    cat, src:{al:m.id, mal:m.idMal||null},
    title: eng || rom, alt: [eng && rom !== eng ? rom : null, m.title.native].filter(Boolean).join(" · "),
    cover: m.coverImage?.extraLarge || m.coverImage?.large || "", banner: m.bannerImage || "",
    color: m.coverImage?.color || null,
    synopsis: stripHtml(m.description),
    year: m.startDate?.year || null, genres: m.genres || [],
    meta: {
      format: (m.format||"").replace(/_/g," "), status: (m.status||"").replace(/_/g," "),
      episodes: m.episodes || (m.nextAiringEpisode ? m.nextAiringEpisode.episode-1 : null),
      chapters: m.chapters || null, volumes: m.volumes || null, duration: m.duration || null,
      studio: m.studios?.nodes?.[0]?.name || null, authors: [...new Set(authors)].slice(0,3),
      score: m.averageScore || null, ended: m.endDate?.year || null,
    }
  };
}
async function searchAniList(q, cat){
  const isAnime = cat==="anime";
  const query = `query($s:String,$t:MediaType${isAnime?"":",$c:CountryCode"}){Page(perPage:20){media(search:$s,type:$t${isAnime?"":",countryOfOrigin:$c"},sort:SEARCH_MATCH,isAdult:false){${AL_FIELDS}}}}`;
  const vars = {s:q, t: isAnime?"ANIME":"MANGA"}; if(!isAnime) vars.c = COUNTRY[cat];
  const d = await anilist(query, vars);
  return d.Page.media.map(m=>fromAniList(m, cat));
}
async function refreshAniList(item){
  const d = await anilist(`query($id:Int){Media(id:$id){${AL_FIELDS}}}`, {id:item.src.al});
  return fromAniList(d.Media, item.cat);
}

/* ---------- Jikan (MyAnimeList): anime episode titles ---------- */
async function animeEpisodes(item, onProgress){
  if(!item.src.mal) throw new Error("no MAL id");
  const out = []; let page = 1, last = 1;
  do{
    const d = await getJSON(`https://api.jikan.moe/v4/anime/${item.src.mal}/episodes?page=${page}`);
    (d.data||[]).forEach(e=>out.push({
      k: String(e.mal_id), no: e.mal_id, title: e.title || e.title_romanji || "",
      date: e.aired ? e.aired.slice(0,10) : "", filler: !!e.filler, recap: !!e.recap
    }));
    last = d.pagination?.last_visible_page || 1;
    onProgress && onProgress(page, last);
    page++;
    if(d.pagination?.has_next_page) await sleep(450);
    else break;
  } while(page <= last && page < 60);
  return out;
}

/* ---------- MangaDex: chapter titles for manga / manhwa / manhua ---------- */
async function findMangaDexId(item){
  const titles = [item.title, ...(item.alt||"").split(" · ")].filter(Boolean);
  for(const t of titles.slice(0,2)){
    const d = await getJSON(`https://api.mangadex.org/manga?title=${encodeURIComponent(t)}&limit=10&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica`);
    const list = d.data || [];
    const hit = list.find(m=>String(m.attributes?.links?.al||"")===String(item.src.al)) ||
                list.find(m=>item.src.mal && String(m.attributes?.links?.mal||"")===String(item.src.mal));
    if(hit) return hit.id;
  }
  return null;
}
async function mangaChapters(item, onProgress){
  let id = item.src.mdx || await findMangaDexId(item);
  if(!id) throw new Error("not on MangaDex");
  item.src.mdx = id;
  const map = new Map(); let offset = 0, total = 1;
  while(offset < total && offset < 9900){
    const d = await getJSON(`https://api.mangadex.org/chapter?manga=${id}&translatedLanguage[]=en&order[chapter]=asc&limit=100&offset=${offset}&includeEmptyPages=0&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica`);
    total = d.total || 0;
    (d.data||[]).forEach(c=>{
      const a = c.attributes; if(a.chapter==null) return;
      const k = String(parseFloat(a.chapter)); const prev = map.get(k);
      if(!prev || (!prev.title && a.title)) map.set(k, {k, no: parseFloat(a.chapter), title: a.title || "", vol: a.volume || "", date: (a.publishAt||"").slice(0,10)});
    });
    offset += 100; onProgress && onProgress(Math.min(offset,total), total);
    if(offset < total) await sleep(250);
  }
  const out = [...map.values()].sort((a,b)=>a.no-b.no);
  if(!out.length) throw new Error("no chapters");
  return out;
}

/* ---------- TVmaze: TV shows + episodes ---------- */
function fromTVmaze(s){
  return {
    cat:"tv", src:{tvm:s.id, imdb:s.externals?.imdb||null},
    title: s.name, alt: s.language && s.language!=="English" ? s.language : "",
    cover: s.image?.original || s.image?.medium || "", banner:"",
    synopsis: stripHtml(s.summary), year: s.premiered ? +s.premiered.slice(0,4) : null,
    genres: s.genres || [],
    meta: { format: s.type || "TV", status: s.status || "", network: s.network?.name || s.webChannel?.name || null,
            runtime: s.averageRuntime || s.runtime || null, ended: s.ended ? +s.ended.slice(0,4) : null,
            score: s.rating?.average ? Math.round(s.rating.average*10) : null }
  };
}
async function searchTV(q){
  const d = await getJSON(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(q)}`);
  return d.map(r=>fromTVmaze(r.show));
}
async function refreshTV(item){ return fromTVmaze(await getJSON(`https://api.tvmaze.com/shows/${item.src.tvm}`)); }
async function tvEpisodes(item){
  const d = await getJSON(`https://api.tvmaze.com/shows/${item.src.tvm}/episodes`);
  return d.filter(e=>e.number!=null).map(e=>({
    k:`S${e.season}E${e.number}`, season:e.season, no:e.number, title:e.name||"",
    date:e.airdate||"", runtime:e.runtime||null, summary: stripHtml(e.summary)
  }));
}

/* ---------- iTunes: movies ---------- */
function fromITunes(r){
  return {
    cat:"movie", src:{itunes:r.trackId},
    title: r.trackName, alt: r.artistName ? "Directed by " + r.artistName : "",
    cover: (r.artworkUrl100||"").replace(/\/\d+x\d+bb\./, "/600x900bb."), banner:"",
    synopsis: r.longDescription || r.shortDescription || "",
    year: r.releaseDate ? +r.releaseDate.slice(0,4) : null,
    genres: r.primaryGenreName ? [r.primaryGenreName] : [],
    meta: { format:"Movie", runtime: r.trackTimeMillis ? Math.round(r.trackTimeMillis/60000) : null,
            rated: r.contentAdvisoryRating || null, director: r.artistName || null }
  };
}
async function searchMovies(q){
  const d = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=movie&entity=movie&limit=25&country=US`);

/* ---------- Google Books + Open Library: books ---------- */
function isbnOf(ids){ const i = (ids||[]).find(x=>x.type==="ISBN_13") || (ids||[]).find(x=>x.type==="ISBN_10"); return i ? i.identifier : null; }
function fromGoogle(v){
  const i = v.volumeInfo || {}; const isbn = isbnOf(i.industryIdentifiers);
  const thumb = (i.imageLinks?.thumbnail || i.imageLinks?.smallThumbnail || "").replace(/^http:/,"https:").replace("&edge=curl","");
  return {
    cat:"book", src:{gb:v.id, isbn},
    title: i.title + (i.subtitle ? ": " + i.subtitle : ""), alt: (i.authors||[]).join(", "),
    cover: isbn ? `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false` : thumb, cover2: thumb, banner:"",
    synopsis: stripHtml(i.description), year: i.publishedDate ? +i.publishedDate.slice(0,4) : null,
    genres: (i.categories||[]).slice(0,3),
    meta: { format:"Book", pages: i.pageCount || null, authors: i.authors || [], publisher: i.publisher || null, isbn }
  };
}
async function searchBooksGoogle(q){
  const d = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(q)}&maxResults=25&printType=books`);
  return (d.items||[]).map(fromGoogle);
}
async function searchBooksOL(q){
  const d = await getJSON(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=25&fields=key,title,subtitle,author_name,first_publish_year,number_of_pages_median,cover_i,subject,isbn,publisher`);
  return (d.docs||[]).map(b=>({
    cat:"book", src:{ol:b.key, isbn:(b.isbn||[])[0]||null},
    title: b.title + (b.subtitle ? ": " + b.subtitle : ""), alt:(b.author_name||[]).slice(0,3).join(", "),
    cover: b.cover_i ? `https://covers.openlibrary.org/b/id/${b.cover_i}-L.jpg` : "", banner:"",
    synopsis:"", year:b.first_publish_year||null, genres:(b.subject||[]).slice(0,3),
    meta:{format:"Book", pages:b.number_of_pages_median||null, authors:b.author_name||[], publisher:(b.publisher||[])[0]||null}
  }));
}
async function searchBooks(q){
  let a = [];
  try{ a = await searchBooksGoogle(q); }catch(e){}
  if(a.length >= 3) return a;
  try{ const b = await searchBooksOL(q); return a.concat(b); }catch(e){ if(a.length) return a; throw e; }
}
async function olDescription(key){
  try{ const d = await getJSON(`https://openlibrary.org${key}.json`); return stripHtml(typeof d.description==="string" ? d.description : d.description?.value || ""); }
  catch(e){ return ""; }
}

async function browseAniList(cat, {genre, tag, sort="POPULARITY_DESC", page=1}){
  const isAnime = cat==="anime";
  const args = ["page:$p","perPage:30"];
  const decl = ["$p:Int","$t:MediaType","$s:[MediaSort]"]; if(!isAnime) decl.push("$c:CountryCode"); if(genre) decl.push("$g:[String]"); if(tag) decl.push("$tg:[String]");
  const q = `query(${decl.join(",")}){Page(${args.join(",")}){pageInfo{hasNextPage}
    media(type:$t${isAnime?"":",countryOfOrigin:$c"}${genre?",genre_in:$g":""}${tag?",tag_in:$tg":""},sort:$s,isAdult:false){${AL_FIELDS}}}}`;
  const vars = {p:page, t:isAnime?"ANIME":"MANGA", s:[sort]};
  if(!isAnime) vars.c = COUNTRY[cat]; if(genre) vars.g = [genre]; if(tag) vars.tg = [tag];
  const d = await anilist(q, vars);
  return {items: d.Page.media.map(m=>fromAniList(m,cat)), more: d.Page.pageInfo.hasNextPage};
}
async function alRecs(item){
  const d = await anilist(`query($id:Int){Media(id:$id){recommendations(perPage:12,sort:RATING_DESC){nodes{rating mediaRecommendation{${AL_FIELDS}}}}}}`, {id:item.src.al});
  return (d.Media?.recommendations?.nodes||[]).filter(n=>n.mediaRecommendation && n.rating>0).map(n=>{
    const m = n.mediaRecommendation;
    const cat = m.type==="ANIME" ? "anime" : ({KR:"manhwa",CN:"manhua",TW:"manhua"}[m.countryOfOrigin] || "manga");
    return {...fromAniList(m, cat), _score:n.rating};
  });
}
let tvIndex = null;
async function tvIndexLoad(){
  if(tvIndex) return tvIndex;
  const pages = await Promise.all([0,1,2,3,4,5].map(p=>getJSON(`https://api.tvmaze.com/shows?page=${p}`).catch(()=>[])));
  tvIndex = pages.flat().filter(s=>s && s.image);

}
async function browseTV({genre, sort="rating", page=1}){
  let list = await tvIndexLoad();
  if(genre) list = list.filter(s=>(s.genres||[]).includes(genre));
  list = list.slice().sort(sort==="az" ? (a,b)=>a.name.localeCompare(b.name) : sort==="new" ? (a,b)=>(b.premiered||"").localeCompare(a.premiered||"") : (a,b)=>(b.rating?.average||0)-(a.rating?.average||0));
  const per = 30, sl = list.slice((page-1)*per, page*per);
  return {items: sl.map(fromTVmaze), more: list.length > page*per};
}
async function browseBooks({genre, sort="relevance", page=1}){
  const g = genre || "fiction";
  try{
    const d = await getJSON(`https://www.googleapis.com/books/v1/volumes?q=subject:${encodeURIComponent(g)}&orderBy=${sort}&maxResults=30&startIndex=${(page-1)*30}&printType=books&langRestrict=en`);
    const items = (d.items||[]).map(fromGoogle).filter(b=>b.cover);
    if(items.length) return {items, more: (d.totalItems||0) > page*30};
  }catch(e){}
  const slug = g.toLowerCase().replace(/[^a-z]+/g,"_");
  const d = await getJSON(`https://openlibrary.org/subjects/${slug}.json?limit=30&offset=${(page-1)*30}`);
  return {items:(d.works||[]).map(w=>({cat:"book", src:{ol:w.key}, title:w.title, alt:(w.authors||[]).map(a=>a.name).join(", "),
    cover: w.cover_id ? `https://covers.openlibrary.org/b/id/${w.cover_id}-L.jpg` : "", banner:"", synopsis:"", year:w.first_publish_year||null,
    genres:[genre].filter(Boolean), meta:{format:"Book", authors:(w.authors||[]).map(a=>a.name)}})).filter(b=>b.cover), more:(d.work_count||0) > page*30};
}
async function browseMovies({genre, sort="top", page=1}){
  const g = genre || "Drama";
  let res = [];
  try{
    const d = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(g)}&media=movie&entity=movie&attribute=genreIndex&limit=60&country=US`);
    res = (d.results||[]).map(fromITunes);
  }catch(e){}
  if(res.length < 5){ try{ const d = await jsonp(`https://itunes.apple.com/search?term=${encodeURIComponent(g)}&media=movie&entity=movie&limit=60&country=US`); res = (d.results||[]).map(fromITunes).filter(m=>!genre || (m.genres[0]||"").toLowerCase().includes(g.split(" ")[0].toLowerCase())); }catch(e){} }
  if(sort==="az") res.sort((a,b)=>a.title.localeCompare(b.title));
  return {items: res.slice((page-1)*30, page*30), more: res.length > page*30};
}

  if(cat==="tv") return browseTV(opts);

}

}}}`, {ids: ids.slice(i,i+50)});

      out[m.id] = { status:m.status, total: m.episodes || m.chapters || null, volumes: m.volumes || null,
        aired: m.nextAiringEpisode ? m.nextAiringEpisode.episode - 1 : (m.status==="FINISHED" ? m.episodes : null),

/* ============ SMART SEARCH (find by description, did-you-mean) ============ */
const TYPEWORD = {anime:"anime", manga:"manga", manhwa:"manhwa webtoon", manhua:"manhua", tv:"television series", movie:"film", book:"novel"};
const STOP = new Set("a an the and or but of to in on at for with from by about into over after before is are was were be been being it its this that these those he she they them his her their there where when who whom which what why how i me my we our you your some any all one two three not no very just like only also then than so such can could would should will may might do does did has have had get gets got about story anime manga manhwa manhua show series book novel movie film webtoon guy girl boy man woman main character mc remember called named".split(" "));
function words(t){ return (t||"").toLowerCase().replace(/[^a-z0-9\s']/g," ").split(/\s+/).filter(w=>w.length>2 && !STOP.has(w)); }
function lev(a,b){ a=a.toLowerCase(); b=b.toLowerCase(); const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }
function similar(q, r){
  const qs = q.toLowerCase().trim(); let best = 0;
  [r.title, ...(r.alt||"").split(/ · |, /)].filter(Boolean).forEach(t=>{ t=t.toLowerCase();
    const s1 = 1 - lev(qs, t.slice(0, Math.max(qs.length, 1)+2)) / Math.max(qs.length, t.length, 1);
    const s2 = t.includes(qs) ? 1 : 0; best = Math.max(best, s1, s2); });
  return best;
}
function pickBest(list, name){ if(!list?.length) return null; let b = list[0], bs = -1; list.slice(0,8).forEach(r=>{ const s = similar(name, r); if(s>bs){ bs=s; b=r; } }); return bs > 0.45 ? b : null; }
const TAG_HINTS = [
  [/isekai|another world|transported|summoned|other world/, "Isekai"], [/reincarnat|reborn|past life|second life/, "Reincarnation"],
  [/regress|time loop|go(es)? back in time|back to the past|second chance|return(s|ed)? to/, "Time Manipulation"], [/revenge|vengeance|betray/, "Revenge"],
  [/martial|sect|murim|kung ?fu|sword(s)?man/, "Martial Arts"], [/school|student|academy|class/, "School"], [/dungeon|gate|hunter|tower|raid/, "Dungeon"],
  [/villainess|duchess|lady|noble/, "Villainess"], [/cultivat|qi |immortal|dao/, "Cultivation"], [/game|system|level(s)? up|player|stats|vr/, "Video Games"],
  [/magic|mage|witch|wizard|spell/, "Magic"], [/surviv|apocalyp|zombie|monster(s)? invade/, "Survival"], [/family|adopt|siblings/, "Found Family"],
];
const GENRE_HINTS = [[/romance|love|marry|marriage|dating|crush|boyfriend|girlfriend|husband|wife/, "Romance"],[/funny|comedy|hilarious/, "Comedy"],[/mystery|detective|murder|solve|poison|apothecary/, "Mystery"],
  [/horror|scary|ghost|demon(s)?/, "Horror"],[/sport|basketball|volleyball|soccer|baseball|boxing/, "Sports"],[/robot|mecha/, "Mecha"],[/space|alien|future|sci/, "Sci-Fi"],[/fight|battle|war|action/, "Action"],[/sad|cry|tragic|tragedy/, "Drama"]];
function guessTags(text){ const t = text.toLowerCase(); return {tags: TAG_HINTS.filter(([re])=>re.test(t)).map(x=>x[1]), genres: GENRE_HINTS.filter(([re])=>re.test(t)).map(x=>x[1])}; }
function cleanWikiTitle(t){ return t.replace(/\s*\([^)]*\)\s*$/,"").trim(); }
async function wikiSearch(q, n=10){
  const d = await getJSON(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&srlimit=${n}&srinfo=suggestion&srprop=snippet&format=json&origin=*`);
  return {hits:(d.query?.search||[]).map(h=>({title:h.title, snippet:stripHtml(h.snippet)})), suggestion:d.query?.searchinfo?.suggestion||null};
}
const WIKI_SKIP = /^(List of|Lists of)|episodes|characters|soundtrack|discography|\(disambiguation\)|season \d|filmography|bibliography/i;
async function describeSearch(cat, text, onStep){
  const out = []; const seen = new Set();
  const add = (r, why) => { const k = (r.title||"").toLowerCase(); if(!k || seen.has(k)) return; seen.add(k); out.push({...r, _why: why}); };
  const tw = words(text);
  // 1) Wikipedia full-text search finds titles from plot descriptions
  try{
    onStep && onStep("Searching plot descriptions…");
    const w = await wikiSearch(`${text} ${TYPEWORD[cat]||""}`, 10);
    for(const h of w.hits.filter(h=>!WIKI_SKIP.test(h.title)).slice(0,6)){
      const name = cleanWikiTitle(h.title);
      try{ const rs = await searchCat(cat, name); const best = pickBest(rs, name); if(best) add(best, h.snippet ? "“…" + h.snippet.slice(0,110).trim() + "…”" : "Matches your description"); }catch(e){}
    }
  }catch(e){}
  // 2) Tag + genre guess, ranked by how many of your words appear in each synopsis
  if(isAL(cat)){
    const {tags, genres} = guessTags(text);
    onStep && onStep("Checking titles with matching themes…");
    const tries = [];
    if(tags.length || genres.length) tries.push({tag:tags[0]||"", genre:genres[0]||""});
    if(tags.length>1) tries.push({tag:tags[1], genre:""});
    for(const t of tries){
      try{
        const r = await browseAniList(cat, {tag:t.tag, genre:t.genre, sort:"POPULARITY_DESC"});
        r.items.map(x=>({x, s: words(x.synopsis+" "+x.genres.join(" ")).filter(w=>tw.includes(w)).length}))
          .filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,8)
          .forEach(o=>add(o.x, `Fits: ${[t.genre,t.tag].filter(Boolean).join(", ")} · ${o.s} of your words match the story`));
      }catch(e){}
    }
  }
  // 3) Books: Google Books searches the full description text
  if(cat==="book"){ try{ onStep && onStep("Searching book descriptions…"); (await searchBooksGoogle(text)).slice(0,8).forEach(b=>add(b, "Description match")); }catch(e){} }
  if(cat==="tv" || cat==="movie"){ /* Wikipedia covers these well */ }
  return out.slice(0,15);
}
async function didYouMean(cat, q){
  const alts = [];
  try{
    const w = await wikiSearch(`${q} ${TYPEWORD[cat]||""}`, 6);
    if(w.suggestion){ const sg = w.suggestion.replace(new RegExp("\\s*" + (TYPEWORD[cat]||"").replace(/\s+/g,"\\s+") + "\\s*$","i"),"").trim(); if(sg) alts.push(sg); }
    w.hits.filter(h=>!WIKI_SKIP.test(h.title)).slice(0,4).forEach(h=>alts.push(cleanWikiTitle(h.title)));
  }catch(e){}
  const ws = q.trim().split(/\s+/); if(ws.length>2 && !alts.length) alts.push(ws.slice(0,2).join(" "));
  const seenA = new Set([q.toLowerCase().trim()]); const uniq = [];
  alts.map(a=>a.trim()).forEach(a=>{ const k=a.toLowerCase(); if(a && !seenA.has(k)){ seenA.add(k); uniq.push(a); } });
  uniq.splice(4);
  const results = []; const seen = new Set();
  const good = [];
  for(const a of uniq){ try{ const rs = await searchCat(cat, a); if(rs.length) good.push(a); rs.slice(0,4).forEach(r=>{ const k=r.title.toLowerCase(); if(!seen.has(k)){ seen.add(k); results.push(r); } }); }catch(e){} }
  // show the names of real matches rather than raw spellings when they're the same title
  const names = []; const nk = new Set();
  [...results.slice(0,3).filter(r=>good.some(a=>similar(a,r)>0.7)).map(r=>r.title), ...good].forEach(n=>{ const k=n.toLowerCase(); if(!nk.has(k)){ nk.add(k); names.push(n); } });
  return {alts: names.slice(0,3), results};
}

  describeSearch = async (cat, text, onStep)=>{ onStep && onStep("Searching plot descriptions…"); await sleep(600); const tw = words(text); const {tags,genres} = guessTags(text);
    return C2.filter(x=>x.cat===cat).map(x=>({x, s: words(x.title+" "+x.genres.join(" ")+" "+(x.tags||[]).join(" ")+" "+(x.blurb||"")).filter(w=>tw.includes(w)).length*2 + x.genres.filter(g=>genres.includes(g)).length + (x.tags||[]).filter(t=>tags.includes(t)).length*2}))
      .filter(o=>o.s>0).sort((a,b)=>b.s-a.s).slice(0,8).map(o=>({...JSON.parse(JSON.stringify(o.x)), _why: `Sample match · ${[...o.x.genres.filter(g=>genres.includes(g)), ...(o.x.tags||[]).filter(t=>tags.includes(t))].join(", ") || "words in the story"}`})); };
  didYouMean = async (cat, q)=>{ await sleep(400); const scored = C2.filter(x=>x.cat===cat).map(x=>({x, d: lev(q, x.title.slice(0, q.length+3))/Math.max(q.length,1)})).sort((a,b)=>a.d-b.d).slice(0,3).filter(o=>o.d<0.6);
    return {alts: scored.map(o=>o.x.title), results: scored.map(o=>JSON.parse(JSON.stringify(o.x)))}; };
}

<script>/* ============ STORAGE (IndexedDB, with localStorage fallback) ============ */
const DB = (()=>{
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res,rej)=>{
      try{
        const r = indexedDB.open("shelf", 1);
        r.onupgradeneeded = ()=> r.result.createObjectStore("kv");
        r.onsuccess = ()=> res(r.result); r.onerror = ()=> rej(r.error);
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  async function get(k){
    try{ const db = await open(); return await new Promise((res,rej)=>{ const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
    catch(e){ try{ const v = localStorage.getItem("shelf:"+k); return v ? JSON.parse(v) : undefined; }catch(_){ return undefined; } }
  }
  async function set(k,v){
    try{ const db = await open(); await new Promise((res,rej)=>{ const t = db.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=res; t.onerror=()=>rej(t.error); }); }
    catch(e){ try{ localStorage.setItem("shelf:"+k, JSON.stringify(v)); }catch(_){} }
  }
  async function del(k){
    try{ const db = await open(); await new Promise(res=>{ const t = db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete=res; t.onerror=res; }); }catch(e){}
    try{ localStorage.removeItem("shelf:"+k); }catch(_){}
  }
  async function keys(){
    try{ const db = await open(); return await new Promise(res=>{ const q = db.transaction("kv").objectStore("kv").getAllKeys(); q.onsuccess=()=>res(q.result); q.onerror=()=>res([]); }); }
    catch(e){ return []; }
  }
  return {get,set,del,keys};
})();

/* ============ CATEGORIES (each person makes their own) ============ */
const TRACK = {
  episodes:{unit:"episode",units:"episodes",verb:"Watching",done:"Watched", label:"Episodes"},
  chapters:{unit:"chapter",units:"chapters",verb:"Reading",done:"Read", label:"Chapters"},
  pages:{unit:"page",units:"pages",verb:"Reading",done:"Read", label:"Pages"},
  once:{unit:"item",units:"",verb:"In progress",done:"Done", label:"Done or not done"},
};
const PALETTE = ["#ff5d8f","#ffb547","#8b6cff","#ff7a45","#3fc1ff","#ff4d5e","#3ddc97","#f15bb5","#00bbf9","#9b5de5","#fee440","#06d6a0","#ef476f","#118ab2"];
function C(id){
  const p = (data && data.profiles && data.active) ? prof() : null;
  const base = CATS[id];
  if(base) return {...base, key:id, label: p?.catNames?.[id] || base.label, color: p?.catColors?.[id] || base.color};
  const cu = p?.custom?.[id] || Object.values(data?.profiles||[]).map(x=>x.custom?.[id]).find(Boolean);
  if(cu){ const tr = TRACK[cu.track] || TRACK.once; return {...tr, key:id, label:cu.name, color:cu.color, custom:true, track:cu.track, own:true}; }
  return {label:"Other", color:"#888", unit:"item", units:"", verb:"In progress", done:"Done", key:id, custom:true, track:"once"};
}
const isOnce = it => it.cat==="movie" || (C(it.cat).custom && C(it.cat).track==="once");
const isPages = it => it.cat==="book" || (C(it.cat).custom && C(it.cat).track==="pages");
const isSearchable = cat => !!CATS[cat];

/* ============ ITEM HELPERS ============ */
const STATUSES = ["current","planned","completed","paused","dropped"];
function statusLabel(s, cat){
  const c = C(cat) || CATS.book;
  return {current:c.verb, planned:"Plan to " + (c.verb==="Watching"?"watch":"read"), completed:c.done==="Watched"?"Completed":"Finished", paused:"On hold", dropped:"Dropped"}[s] || s;
}
function totalOf(it){
  if(isOnce(it)) return 1;
  if(isPages(it)) return it.meta?.pages || 0;
  const tk = it.track||{}, extra = Math.max((C(it.cat)?.unit==="episode" && it.cat!=="tv" ? it.meta?.episodes : C(it.cat)?.vols ? it.meta?.chapters : 0) || 0, it.cat==="anime" ? tk.aired||0 : C(it.cat)?.vols ? Math.floor(tk.latest||0) : 0);
  if(it.unitsTotal) return Math.max(it.unitsTotal, extra);
  if(extra) return extra;
  return (C(it.cat)?.unit==="episode" ? it.meta?.episodes : it.meta?.chapters) || it.manualTotal || 0;
}
function doneOf(it){
  if(isOnce(it)) return it.my.status==="completed" ? 1 : 0;
  if(isPages(it)) return it.my.pages || 0;
  if(it.unitsTotal) return Object.keys(it.my.done||{}).length;
  return it.my.count || 0;
}
function pct(it){ if(isOnce(it) && it.my.status!=="completed" && it.my.time && it.meta?.runtime) return Math.min(99, Math.round(it.my.time/(it.meta.runtime*60)*100)); const t = totalOf(it), d = doneOf(it); return t ? Math.min(100, Math.round(d/t*100)) : (it.my.status==="completed"?100:0); }
function newItem(base){
  return {...base, id: uid(), added: Date.now(), updated: Date.now(),
    my:{status:"planned", rating:0, notes:[], done:{}, count:0, pages:0, owned:false, ownFormat:"", vols:{}, started:"", finished:"", rewatch:0}};
}
function touch(it){ it.updated = Date.now(); save(); }
function findExisting(r){
  return Object.values(lib()).find(it => it.cat===r.cat && (
    (r.src.al && it.src?.al===r.src.al) || (r.src.tvm && it.src?.tvm===r.src.tvm) ||
    (r.src.itunes && it.src?.itunes===r.src.itunes) || (r.src.gb && it.src?.gb===r.src.gb) || (r.src.ol && it.src?.ol===r.src.ol) ||
    (it.title.trim().toLowerCase()===String(r.title||"").trim().toLowerCase() && (!r.year || !it.year || Math.abs(r.year-it.year)<=1))));
}

  const gset = [...new Set(items.flatMap(i=>i.genres||[]))].sort();

  const gs = $("#h-genre"); if(gs){ gs.innerHTML = `<option value="">All genres</option>` + gset.map(g=>`<option ${g===view.genre?"selected":""}>${esc(g)}</option>`).join(""); gs.classList.toggle("hidden", !gset.length); }
  if(view.genre) items = items.filter(i=>(i.genres||[]).includes(view.genre));
  drawContinue();
  const q = view.q.trim().toLowerCase();
  if(q) items = items.filter(i=>(i.title+" "+(i.alt||"")+" "+(i.genres||[]).join(" ")).toLowerCase().includes(q));
  const S = {updated:(a,b)=>b.updated-a.updated, added:(a,b)=>b.added-a.added, title:(a,b)=>a.title.localeCompare(b.title),
             rating:(a,b)=>(b.my.rating||0)-(a.my.rating||0)||b.updated-a.updated, progress:(a,b)=>pct(b)-pct(a),
             genre:(a,b)=>((a.genres||[])[0]||"~").localeCompare((b.genres||[])[0]||"~")||a.title.localeCompare(b.title)};
  items.sort(S[view.sort]||S.updated);

/* ============ 3D RING ============ */
let ringState = {rot:0};
function drawRing(host, all){
  const MAX = 36; const items = all.slice(0, MAX); const n = items.length;
  const CW = 140, gap = 22;
  const step = 360 / Math.max(n, 1);
  const radius = n<=1 ? 0 : n===2 ? 150 : Math.max(170, Math.round((CW/2 + gap/2) / Math.tan(Math.PI / n)));
  const push = n<=2 ? 60 : Math.min(380, 70 + radius*0.42); const tilt = n<=2 ? -4 : -11;
  host.innerHTML = `<div class="ring-wrap"><div class="ring-glow" id="r-glow"></div>
    <div class="ring-stage" id="r-stage"><div class="ring" id="r-ring" style="transform:translateZ(${-radius-push}px) rotateX(${tilt}deg)">
      ${items.map((it,i)=>`<div class="rcard" data-i="${i}">${coverImg(it)}${pct(it)>0?`<div class="rb"><i style="width:${pct(it)}%;background:${C(it.cat).color}"></i></div>`:""}</div>`).join("")}
    </div><div class="ring-floor"></div></div>
    <div class="ring-info" id="r-info"></div>
    <div class="ring-hint">Swipe to spin · tap a cover to open it</div>
    ${all.length>MAX?`<div class="ring-count">Showing ${MAX} of ${all.length}. Use filters or grid view to see the rest.</div>`:""}
  </div>`;
  const stage = $("#r-stage"), ring = $("#r-ring"), cards = [...ring.children], info = $("#r-info"), glow = $("#r-glow");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let rot = ringState.rot % 360, vel = 0, dragging = false, target = null, lastFront = -1, idleAt = performance.now(), sx = 0, sRot = 0, lastX = 0, lastT = 0, moved = 0;
  const frontIndex = ()=> ((Math.round(-rot / step) % n) + n) % n;
  function layout(){
    ring.style.transform = `translateZ(${-radius-push}px) rotateX(${tilt}deg) rotateY(${rot}deg)`;
    cards.forEach((c,i)=>{
      const a = i*step;
      const eff = ((a + rot) % 360 + 540) % 360 - 180;        // -180..180, 0 = front
      const f = Math.cos(eff*Math.PI/180);                    // 1 front, -1 back
      c.style.transform = `rotateY(${a}deg) translateZ(${radius}px)`;
      c.style.opacity = n<=2 ? 1 : (0.25 + 0.75*Math.max(0,(f+1)/2)**1.6).toFixed(3);
      c.style.filter = `brightness(${(0.45 + 0.55*Math.max(0,(f+1)/2)).toFixed(3)})`;
      c.style.zIndex = Math.round(f*100)+100;
    });
    const fi = frontIndex();
    if(fi!==lastFront){ lastFront = fi; showInfo(items[fi]); }
  }
  function showInfo(it){
    const c = C(it.cat); const t = totalOf(it), d = doneOf(it);
    let prog = statusLabel(it.my.status, it.cat);
    if(!isOnce(it) && t && it.my.status!=="completed") prog += ` · ${isPages(it)?"page":c.unit==="episode"?"Ep":"Ch"} ${d} of ${t}`;
    info.innerHTML = `<span class="rk" style="background:${c.color}">${c.label}</span>
      <div class="rt">${esc(it.title)}</div><div class="rs">${esc(prog)}${it.my.rating?` · ★ ${it.my.rating}/10`:""}</div>
      <button class="open" style="background:${c.color}">Open</button>`;
    info.querySelector(".open").onclick = ()=>go("#item/"+it.id);
    glow.style.setProperty("--gc", it.color || c.color);
  }
  function snapTo(i){ // rotate the shortest way so card i faces front
    const want = -i*step; let diff = ((want - rot) % 360 + 540) % 360 - 180; target = rot + diff; vel = 0;
  }
  function tick(now){
    if(!document.body.contains(ring)){ ringState.rot = rot; return; }
    if(!dragging){
      if(target!=null){ const d = target - rot; rot += d*0.14; if(Math.abs(d)<0.05){ rot = target; target = null; idleAt = now; } }
      else if(Math.abs(vel) > 0.02){ rot += vel; vel *= 0.95; if(Math.abs(vel)<=0.25){ vel = 0; snapTo(frontIndex()); } }
      else if(!reduce && n>2 && now - idleAt > 2500){ rot -= 0.07; }  // lazy Susan drift
    }
    layout(); ringState.rot = rot; requestAnimationFrame(tick);
  }
  stage.addEventListener("pointerdown", e=>{ dragging = true; target = null; vel = 0; sx = lastX = e.clientX; sRot = rot; lastT = performance.now(); moved = 0; stage.setPointerCapture(e.pointerId); });
  stage.addEventListener("pointermove", e=>{
    if(!dragging) return; const now = performance.now();
    const dx = e.clientX - sx; moved = Math.max(moved, Math.abs(dx));
    rot = sRot + dx * (n>8 ? 0.32 : 0.45);
    const dt = Math.max(1, now - lastT); vel = (e.clientX - lastX) * (n>8 ? 0.32 : 0.45) * (16/dt); lastX = e.clientX; lastT = now;
  });
  const end = e=>{
    if(!dragging) return; dragging = false; idleAt = performance.now();
    if(moved < 7){ // a tap
      const el = document.elementFromPoint(e.clientX, e.clientY); const card = el && el.closest(".rcard");
      if(card){ const i = +card.dataset.i; if(i===frontIndex()) go("#item/"+items[i].id); else snapTo(i); }
      else snapTo(frontIndex());
      vel = 0; return;
    }
    if(Math.abs(vel) < 0.6) snapTo(frontIndex());
  };
  stage.addEventListener("pointerup", end); stage.addEventListener("pointercancel", e=>{ dragging=false; snapTo(frontIndex()); });
  layout(); requestAnimationFrame(tick);
}

    }catch(e){ res.innerHTML = `<div class="hint">Couldn't search right now. Check your connection and try again.</div>`; }
  };

    $("#d-rnum",pg).textContent = it.my.rating ? it.my.rating+" / 10" : "Not rated";
    $("#d-rlabel",pg).textContent = RATING_WORDS[it.my.rating] || "Tap a number to rate";
  };
  pg.querySelectorAll("#d-rating button").forEach(b=>b.onclick=()=>{ const n=+b.dataset.n; it.my.rating = it.my.rating===n?0:n; touch(it); drawRating(); });
  drawRating();

  const drawProgress = ()=> renderProgress(pg, it, ()=>{ drawStatus(); drawUnitsLight(); });
  const drawUnitsLight = ()=> pg.dispatchEvent(new Event("units-refresh"));
  drawProgress();
  if($("#d-own",pg)) renderOwn(pg, it);
  renderRelease(pg, it);
  renderUnits(pg, it, ()=>{ drawProgress(); drawStatus(); });

  const drawNotes = ()=>{
    const n = it.my.notes.slice().sort((a,b)=>b.at-a.at);
    $("#d-notes",pg).innerHTML = n.map(x=>`<div class="note"><div class="nd"><span>${new Date(x.at).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"})}</span><button data-id="${x.id}">Delete</button></div><div class="nt">${esc(x.text)}</div></div>`).join("");
    $("#d-notes",pg).querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const i = it.my.notes.findIndex(x=>x.id===b.dataset.id); const [rm] = it.my.notes.splice(i,1); touch(it); drawNotes();
      toast("Note deleted", ()=>{ it.my.notes.push(rm); touch(it); drawNotes(); });
    });
  };
  $("#d-addnote",pg).onclick = ()=>{ const t = $("#d-note",pg).value.trim(); if(!t) return; it.my.notes.push({id:uid(), at:Date.now(), text:t}); $("#d-note",pg).value=""; touch(it); drawNotes(); toast("Note saved"); };
  drawNotes();
  loadMoreLike(it, $("#d-like",pg));
}

function setStatus(it, s){
  const prev = it.my.status; it.my.status = s;
  if(s==="current" && !it.my.started) it.my.started = today();
  if(s==="completed"){
    if(!it.my.started) it.my.started = today();
    if(prev!=="completed") it.my.finished = today();
    if(isPages(it) && it.meta?.pages) it.my.pages = it.meta.pages;
  }
  if(s!=="completed" && prev==="completed" && isOnce(it)) it.my.finished = "";
  touch(it);
}
function autoStatus(it){
  const t = totalOf(it), d = doneOf(it);
  if(d>0 && it.my.status==="planned"){ setStatus(it,"current"); }
  const airing = /RELEASING|Running|NOT YET/i.test(it.meta?.status||"");
  if(t && d>=t && it.my.status!=="completed" && !airing){ setStatus(it,"completed"); toast("All done! Marked as " + statusLabel("completed", it.cat).toLowerCase()); }
}

function openMenu(pg, it){
  pg.querySelectorAll(".menu").forEach(m=>m.remove());
  const m = document.createElement("div"); m.className = "menu";
  const canRefresh = it.src?.al || it.src?.tvm;
  m.innerHTML = `${canRefresh?`<button data-a="refresh">Refresh info</button>`:""}<button data-a="edit">Edit details</button>
    ${it.my.status==="completed"&&!isPages(it)?`<button data-a="rewatch">${C(it.cat).verb==="Watching"?"Start a rewatch":"Start a reread"}</button>`:""}
    <button data-a="del" style="color:var(--bad)">Remove from shelf</button>`;
  pg.appendChild(m);
  const close = ()=>{ m.remove(); document.removeEventListener("click", close); };
  setTimeout(()=>document.addEventListener("click", close), 0);
  m.querySelectorAll("button").forEach(b=>b.onclick=async()=>{
    close(); const a = b.dataset.a;
    if(a==="edit") go("#edit/"+it.id);
    if(a==="rewatch"){ it.my.rewatch=(it.my.rewatch||0)+1; it.my.done={}; it.my.count=0; it.my.finished=""; it.my.status="current"; touch(it); route(); toast("Progress reset for your "+(C(it.cat).verb==="Watching"?"rewatch":"reread")); }
    if(a==="del"){ const copy = it; delete lib()[it.id]; await DB.del("units:"+it.id); save(); back(); toast("Removed "+copy.title, ()=>{ lib()[copy.id]=copy; save(); route(); }); }
    if(a==="refresh"){
      toast("Refreshing…");
      try{
        const f = await refreshItem(it);
        if(f){ ["title","alt","cover","banner","synopsis","year","genres","meta"].forEach(k=>{ if(f[k]!=null && f[k]!=="" ) it[k]=f[k]; }); it.src = {...f.src, ...it.src, mal:f.src.mal||it.src.mal}; }
        delete units[it.id]; await DB.del("units:"+it.id); it.unitsTotal = it.unitsTotal || 0; touch(it); route(); toast("Updated");
      }catch(e){ toast("Couldn't refresh right now"); }
    }
  });
}

/* ----- progress block ----- */
function renderProgress(pg, it, after){
  const box = $("#d-progress",pg); const c = C(it.cat);
  const redraw = ()=>renderProgress(pg, it, after);
  if(isOnce(it)){
    const w = it.my.status==="completed"; const rt = (it.meta?.runtime||0)*60; const tm = it.my.time||0;
    const hms = x=>[Math.floor(x/3600), Math.floor(x%3600/60), Math.floor(x%60)];
    const [h,m,sec] = hms(tm);
    box.innerHTML = `<h3>Progress <span class="r">${!w&&tm&&rt?Math.min(100,Math.round(tm/rt*100))+"%":""}</span></h3>
      <button class="btn ${w?"pri":""}" id="p-w" style="width:100%;padding:13px">${w?"✓ Watched"+(it.my.finished?" · "+fmtDate(it.my.finished):""):"Mark as watched"}</button>
      ${w?"":`<div style="margin-top:14px;font-size:13px;color:var(--mut)">Paused partway? Save where you stopped.</div>
      ${rt?`<div class="prog"><i style="width:${Math.min(100,tm/rt*100)}%"></i></div><div class="prog-row"><span>${fmtTime(tm)}</span><span>${fmtTime(rt)}</span></div>`:""}
      <div class="num-in time-in" style="margin-top:8px"><input type="number" inputmode="numeric" id="t-h" value="${h}" min="0" max="9"><span>h</span><input type="number" inputmode="numeric" id="t-m" value="${m}" min="0" max="59"><span>m</span><input type="number" inputmode="numeric" id="t-s" value="${sec}" min="0" max="59"><span>s</span><button class="btn" id="t-save">Save spot</button></div>`}`;
    $("#p-w",box).onclick = ()=>{ setStatus(it, w?"planned":"completed"); if(!w) it.my.time = 0; touch(it); redraw(); after(); };
    const sv = $("#t-save",box);
    if(sv) sv.onclick = ()=>{ const v = (+$("#t-h",box).value||0)*3600 + (+$("#t-m",box).value||0)*60 + (+$("#t-s",box).value||0);
      it.my.time = Math.max(0, rt ? Math.min(rt, v) : v); if(it.my.time && it.my.status==="planned") setStatus(it,"current"); touch(it); redraw(); after(); toast(it.my.time?"Saved: stopped at "+fmtTime(it.my.time):"Cleared"); };
    return;
  }
  const t = totalOf(it), d = doneOf(it), p = pct(it);
  if(isPages(it)){
    box.innerHTML = `<h3>Progress <span class="r">${t?p+"%":""}</span></h3>
      <div class="prog"><i style="width:${p}%"></i></div>
      <div class="num-in" style="margin-top:10px"><span style="color:var(--mut);font-size:13px">On page</span><input type="number" inputmode="numeric" id="p-pg" value="${d||""}" min="0" placeholder="0"><span style="color:var(--mut);font-size:13px">of</span><input type="number" inputmode="numeric" id="p-tot" value="${t||""}" min="0" placeholder="?"></div>
      <div class="row-btns"><button class="btn pri" id="p-fin">${it.my.status==="completed"?"✓ Finished":"I finished it"}</button></div>`;
    $("#p-pg",box).onchange = e=>{ it.my.pages = Math.max(0, +e.target.value||0); autoStatus(it); touch(it); redraw(); after(); };
    $("#p-tot",box).onchange = e=>{ it.meta = {...it.meta, pages: Math.max(0,+e.target.value||0)}; touch(it); redraw(); };
    $("#p-fin",box).onclick = ()=>{ setStatus(it,"completed"); redraw(); after(); };
    return;
  }
  const u = c.unit, U = u==="episode"?"Episode":"Chapter";
  if(it.unitsTotal){
    const tk = it.track||{}; const out = it.cat==="anime" ? tk.aired : C(it.cat).vols ? tk.latest : it.cat==="tv" ? tk.airedCount : null;
    const tot = Math.max(t, out||0); const ap = out && tot ? Math.min(100, out/tot*100) : 0; const dp = tot ? Math.min(100, d/tot*100) : p;
    const bh = behind(it);
    box.innerHTML = `<h3>Progress <span class="r">${d} of ${tot} ${c.units}</span></h3><div class="prog">${ap?`<span class="aired" style="width:${ap}%"></span>`:""}<i style="width:${dp}%"></i></div>
      <div class="prog-row"><span>${out!=null&&out<tot?`${out} out so far · `:""}${Math.round(dp)}% ${c.done.toLowerCase()}</span><span>${bh>0?`<b style="color:var(--c)">${bh} new</b> · `:""}${nextLabel(it)}</span></div>
      <div class="row-btns"><button class="btn pri" id="p-next">Mark next ${u}</button></div>`;
    $("#p-next",box).onclick = ()=>{ const n = nextUnit(it); if(!n){ toast("You're all caught up"); return; } it.my.done[n.k]=1; autoStatus(it); touch(it); redraw(); after(); };
  } else {
    box.innerHTML = `<h3>Progress <span class="r">${t?p+"%":""}</span></h3>${t?`<div class="prog"><i style="width:${p}%"></i></div>`:""}
      <div class="num-in" style="margin-top:10px"><button class="btn" id="p-minus">−</button><input type="number" inputmode="numeric" id="p-c" value="${d}" min="0"><button class="btn" id="p-plus">+</button><span style="color:var(--mut);font-size:13px">${t?"of "+t+" ":""}${c.units}</span></div>`;
    const set = v=>{ it.my.count = Math.max(0, t ? Math.min(t,v) : v); autoStatus(it); touch(it); redraw(); after(); };
    $("#p-minus",box).onclick = ()=>set(d-1); $("#p-plus",box).onclick = ()=>set(d+1);
    $("#p-c",box).onchange = e=>set(+e.target.value||0);
  }
}
function fmtTime(x){ x=Math.round(x||0); const h=Math.floor(x/3600), m=Math.floor(x%3600/60), s=x%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0'); }
function nextUnit(it){ const L = units[it.id]; return L ? L.find(x=>!it.my.done[x.k]) : null; }
function nextLabel(it){ const n = nextUnit(it); if(!n) return "All caught up"; return "Next: " + (n.season!=null?`S${n.season} E${n.no}`:(C(it.cat).unit==="episode"?"Ep ":"Ch ")+n.no); }

/* ----- owned block ----- */
function renderOwn(pg, it){
  const box = $("#d-own",pg); const c = C(it.cat);
  if(c.vols){
    const nv = it.meta?.volumes || it.manualVols || 0;
    const mode = box.dataset.mode || "o";
    const ownedN = Object.values(it.my.vols).filter(v=>v.o).length, readN = Object.values(it.my.vols).filter(v=>v.r).length;
    box.innerHTML = `<h3>My collection <span class="r">${nv?`${ownedN} owned · ${readN} read`:""}</span></h3>
      ${nv?`<div class="seg" style="margin-bottom:10px"><button data-m="o" class="${mode==="o"?"on":""}">Tap = I own it</button><button data-m="r" class="${mode==="r"?"on":""}">Tap = I read it</button></div>
      <div class="vols">${Array.from({length:nv},(_,i)=>{const v=it.my.vols[i+1]||{};return `<button class="vol ${v.o?"own":""} ${v.r?"read":""}" data-v="${i+1}"><small>VOL</small>${i+1}</button>`}).join("")}</div>
      <div class="legend"><span><i style="border:1.5px solid var(--good)"></i>Owned</span><span><i style="background:var(--c)"></i>Read</span></div>`
      :`<div style="color:var(--mut);font-size:13px">Volume count isn't known yet (it may still be releasing).</div>`}
      <div class="num-in" style="margin-top:12px"><span style="color:var(--mut);font-size:13px">Volumes</span><input type="number" inputmode="numeric" id="o-nv" value="${nv||""}" min="0" placeholder="?"></div>`;
    box.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{ box.dataset.mode=b.dataset.m; renderOwn(pg,it); });
    box.querySelectorAll(".vol").forEach(b=>b.onclick=()=>{ const v = (it.my.vols[b.dataset.v] ||= {}); const key = (box.dataset.mode||"o"); v[key] = v[key]?0:1; if(!v.o&&!v.r) delete it.my.vols[b.dataset.v]; touch(it); renderOwn(pg,it); });
    $("#o-nv",box).onchange = e=>{ const n = Math.max(0, Math.min(300, +e.target.value||0)); it.meta = {...it.meta, volumes:n}; touch(it); renderOwn(pg,it); };
    return;
  }
  const formats = isPages(it) ? ["Paperback","Hardcover","Ebook","Audiobook"] : ["Blu-ray","DVD","Digital"];
  box.innerHTML = `<h3>I own this</h3><div class="seg"><button data-f="" class="${!it.my.owned?"on":""}">No</button>${formats.map(f=>`<button data-f="${f}" class="${it.my.owned&&it.my.ownFormat===f?"on":""}">${f}</button>`).join("")}</div>`;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{ it.my.owned = !!b.dataset.f; it.my.ownFormat = b.dataset.f; touch(it); renderOwn(pg,it); });
}

/* ----- episode / chapter checklist ----- */
async function loadUnits(it, force){
  if(!force && units[it.id]) return units[it.id];
  if(!force){ const c = await DB.get("units:"+it.id); if(c && c.list){ units[it.id] = c.list; return c.list; } }
  return null;
}
function renderUnits(pg, it, after){
  const box = $("#d-units",pg); const c = C(it.cat);
  if(!["anime","tv"].includes(it.cat) && !c.vols){ box.remove(); return; }
  const U = c.unit==="episode" ? "Episodes" : "Chapters";
  let group = null;
  const draw = ()=>{
    const L = units[it.id];
    if(!L){ return; }
    // groups: seasons for TV, blocks of 100 otherwise
    const groups = [];
    if(it.cat==="tv"){ [...new Set(L.map(x=>x.season))].forEach(s=>groups.push({id:"s"+s, label: s===0?"Specials":"Season "+s, list:L.filter(x=>x.season===s)})); }
    else for(let i=0;i<L.length;i+=100){ const sl=L.slice(i,i+100); groups.push({id:"g"+i, label:`${sl[0].no}–${sl[sl.length-1].no}`, list:sl}); }
    if(!group || !groups.find(g=>g.id===group)){ const n = L.findIndex(x=>!it.my.done[x.k]); const gi = groups.findIndex(g=>g.list.includes(L[n<0?L.length-1:n])); group = groups[Math.max(0,gi)].id; }
    const G = groups.find(g=>g.id===group);
    const gDone = G.list.filter(x=>it.my.done[x.k]).length;
    box.innerHTML = `<h3>${U} <span class="r">${Object.keys(it.my.done).length}/${L.length} · hold to mark all before</span></h3>
      ${groups.length>1?`<div class="seasons">${groups.map(g=>{const dn=g.list.every(x=>it.my.done[x.k]);return `<button data-g="${g.id}" class="${g.id===group?"on":""}">${g.label}${dn?" ✓":""}</button>`}).join("")}</div>`:""}
      <div id="u-list">${G.list.map(x=>`<div class="ep ${it.my.done[x.k]?"done":""}" data-k="${esc(x.k)}"><span class="ck"></span><span class="no">${x.season!=null?"E"+x.no:"#"+x.no}</span><span class="et">${x.title?esc(x.title):`<span style="color:var(--dim)">${c.unit==="episode"?"Episode":"Chapter"} ${x.no}</span>`}${x.filler?`<span class="fl">FILLER</span>`:""}${x.recap?`<span class="fl">RECAP</span>`:""}${x.date?`<span class="ed">${x.date>today()?"Airs ":""}${fmtDate(x.date)}${x.vol?" · Vol. "+esc(x.vol):""}</span>`:""}${(it.my.unotes||{})[x.k]?`<span class="un">${esc(it.my.unotes[x.k])}</span>`:""}</span><button class="nb ${(it.my.unotes||{})[x.k]?"has":""}" aria-label="Note">${IC.note}</button></div>`).join("")}</div>
      <div class="row-btns"><button class="btn" id="u-all">${gDone===G.list.length?"Uncheck":"Check"} all in ${groups.length>1?G.label:"list"}</button><button class="btn" id="u-ref">Reload list</button></div>`;
    box.querySelectorAll(".seasons button").forEach(b=>b.onclick=()=>{ group=b.dataset.g; draw(); });
    $("#u-all",box).onclick = ()=>{
      const before = {...it.my.done}; const on = gDone!==G.list.length;
      G.list.forEach(x=>{ if(on) it.my.done[x.k]=1; else delete it.my.done[x.k]; });
      autoStatus(it); touch(it); draw(); after(); toast(on?"Checked "+G.list.length:"Unchecked "+G.list.length, ()=>{ it.my.done=before; touch(it); draw(); after(); });
    };
    $("#u-ref",box).onclick = ()=>fetchList(true);
    box.querySelectorAll(".ep").forEach(row=>{
      let timer=null, long=false, sx=0, sy=0;
      row.querySelector(".nb").addEventListener("click", e=>{ e.stopPropagation(); openUnitNote(row, row.dataset.k); });
      row.addEventListener("pointerdown", e=>{ if(e.target.closest(".nb")) return; long=false; sx=e.clientX; sy=e.clientY; timer=setTimeout(()=>{ long=true; markUpTo(row.dataset.k); }, 520); });
      const cancel = e=>{ if(e && e.type==="pointermove" && Math.hypot(e.clientX-sx,e.clientY-sy)<8) return; clearTimeout(timer); };
      row.addEventListener("pointermove", cancel); row.addEventListener("pointerleave", cancel); row.addEventListener("pointercancel", cancel);
      row.addEventListener("pointerup", ()=>clearTimeout(timer));
      row.addEventListener("contextmenu", e=>e.preventDefault());
      row.addEventListener("click", e=>{ if(long || e.target.closest(".nb")) return; const k=row.dataset.k; if(it.my.done[k]) delete it.my.done[k]; else it.my.done[k]=1; row.classList.toggle("done"); autoStatus(it); touch(it); after(); updateHead(); });
    });
  };
  const openUnitNote = (row, k)=>{
    const nx = row.nextElementSibling; if(nx && nx.classList.contains("un-edit")){ nx.remove(); return; }
    box.querySelectorAll(".un-edit").forEach(x=>x.remove());
    const ed = document.createElement("div"); ed.className = "un-edit";
    ed.innerHTML = `<textarea placeholder="Notes for this ${c.unit}…">${esc((it.my.unotes||{})[k]||"")}</textarea><div class="row-btns"><button class="btn pri">Save</button>${(it.my.unotes||{})[k]?`<button class="btn danger">Delete</button>`:""}<button class="btn">Cancel</button></div>`;
    row.after(ed); const ta = ed.querySelector("textarea"); ta.focus();
    const [bs, b2, b3] = ed.querySelectorAll("button");
    bs.onclick = ()=>{ const v = ta.value.trim(); it.my.unotes ||= {}; if(v) it.my.unotes[k]=v; else delete it.my.unotes[k]; touch(it); draw(); toast(v?"Note saved":"Note removed"); };
    if(b3){ b2.onclick = ()=>{ delete it.my.unotes[k]; touch(it); draw(); toast("Note removed"); }; b3.onclick = ()=>ed.remove(); } else b2.onclick = ()=>ed.remove();
  };
  const updateHead = ()=>{ const L=units[it.id]; const r=$("h3 .r",box); if(r) r.textContent = `${Object.keys(it.my.done).length}/${L.length} · hold to mark all before`; };
  const markUpTo = k=>{
    const L = units[it.id]; const idx = L.findIndex(x=>x.k===k); const before = {...it.my.done};
    for(let i=0;i<=idx;i++) it.my.done[L[i].k]=1;
    if(navigator.vibrate) try{ navigator.vibrate(30); }catch(e){}
    autoStatus(it); touch(it); draw(); after();
    toast(`Marked everything through ${L[idx].season!=null?"S"+L[idx].season+" E"+L[idx].no:"#"+L[idx].no}`, ()=>{ it.my.done=before; touch(it); draw(); after(); });
  };
  async function fetchList(force){
    box.innerHTML = `<h3>${U}</h3><div class="spinner" style="margin:16px auto"></div><div class="hint" id="u-msg" style="padding:6px">Getting the ${U.toLowerCase()} list…</div>`;
    try{
      const L = await fetchUnits(it, (a,b)=>{ const m=$("#u-msg",box); if(m) m.textContent = `Getting the ${U.toLowerCase()} list… (${a} of ${b})`; });
      if(!L || !L.length) throw new Error("empty");
      units[it.id] = L; it.unitsTotal = L.length; await DB.set("units:"+it.id, {at:Date.now(), list:L});
      // carry over a number-only count into checkmarks
      if(it.my.count && !Object.keys(it.my.done).length){ L.slice(0,it.my.count).forEach(x=>it.my.done[x.k]=1); }
      touch(it); draw(); after();
    }catch(e){
      if(force && units[it.id]){ draw(); toast("Couldn't reload right now"); return; }
      const t = c.unit==="episode" ? it.meta?.episodes : it.meta?.chapters;
      box.innerHTML = `<h3>${U}</h3><div style="color:var(--mut);font-size:13.5px">${c.vols?"Chapter titles aren't available for this one, so track it by chapter number above.":"Episode titles aren't available for this one right now, so track it by number above."}</div>
        <div class="row-btns">${t?`<button class="btn" id="u-num">Make a numbered checklist (${t})</button>`:""}<button class="btn" id="u-try">Try again</button></div>`;
      $("#u-try",box).onclick = ()=>fetchList(true);
      if($("#u-num",box)) $("#u-num",box).onclick = async()=>{
        const L = Array.from({length:t},(_,i)=>({k:String(i+1), no:i+1, title:""}));
        units[it.id]=L; it.unitsTotal=L.length; await DB.set("units:"+it.id,{at:Date.now(),list:L});
        if(it.my.count){ L.slice(0,it.my.count).forEach(x=>it.my.done[x.k]=1); }
        touch(it); draw(); after();
      };
    }
  }
  pg.addEventListener("units-refresh", draw);
  loadUnits(it).then(L=>{ if(L){ draw(); } else fetchList(false); });
}

/* ============ MANUAL ADD / EDIT ============ */
function renderManual(editId){
  const ed = editId ? lib()[editId] : null; const p = prof();
  const cat0 = ed ? ed.cat : (view.cat!=="all" ? view.cat : p.cats[0]);
  let coverData = ed ? ed.cover : "";
  const pg = page(`<div class="page-head"><button class="icon-btn" id="m-back">${IC.back}</button><h2 class="display">${ed?"Edit details":"Add manually"}</h2></div>
  <div class="wrap">
    <div class="field"><label>Type</label><select id="m-cat" ${ed?"disabled":""}>${p.cats.map(k=>`<option value="${k}" ${k===cat0?"selected":""}>${esc(C(k).label)}</option>`).join("")}</select></div>
    <div class="field"><label>Title</label><input id="m-title" value="${esc(ed?.title||"")}"></div>
    <div class="field"><label>Cover</label>

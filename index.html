<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf Life</title>
<meta name="theme-color" content="#070a1a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --font-body:Inter,system-ui,-apple-system,sans-serif;--font-display:Fraunces,Georgia,serif;--display-weight:700;
  --bg-a:rgba(7,10,26,.9);--chip:rgba(255,255,255,.08);--ckb:#4a4a62;--shadow:rgba(0,0,0,.45);
  --bg:#070a1a;--bg2:#0d1226;--card:#121831;--line:#222a48;--txt:#eef0fb;--mut:#959bbd;--dim:#5c6385;
  --acc:#7a7cff;--good:#3ddc97;--warn:#ffb547;--bad:#ff5d6c;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:transparent}
html,body{margin:0;color:var(--txt);font-family:var(--font-body);font-size:15px;line-height:1.45}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.hidden{display:none!important}
.display{font-family:var(--font-display);font-weight:var(--display-weight);letter-spacing:-.2px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,var(--bg-a));backdrop-filter:blur(10px);padding:14px 16px 8px}
.top-row{display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:21px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px}
.search{margin-top:10px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{flex:1;background:none;border:0;outline:0;padding:11px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--mut);display:flex;align-items:center;gap:6px}
.chip.on{color:#fff;background:var(--c,var(--acc));border-color:transparent}
.chip .n{opacity:.75;font-weight:500}
.subbar{display:flex;align-items:center;gap:8px;padding:6px 16px 0}
.subbar select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--mut)}
.subbar .count{flex:1;color:var(--dim);font-size:12.5px}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 12px;padding:14px 16px calc(110px + var(--safe-b))}
.tile{position:relative;cursor:pointer;animation:pop .25s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cover{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--bg2),var(--card));box-shadow:0 6px 18px var(--shadow)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-family:var(--font-display);font-size:14px;color:var(--mut)}
.tile .badge{position:absolute;top:6px;left:6px;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.65);color:#fff;letter-spacing:.3px;text-transform:uppercase}
.tile .rate{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--warn);color:#1a1200}
.tile .own{position:absolute;bottom:9px;right:6px;font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;background:rgba(61,220,151,.9);color:#032}
.tile .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.6)}
.tile .bar i{display:block;height:100%;background:var(--c,var(--acc))}
.tile .t{margin-top:7px;font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .s{font-size:11.5px;color:var(--mut);margin-top:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:60px 20px}
.empty .big{font-family:var(--font-display);font-size:22px;color:var(--txt);margin-bottom:6px}

.fab{position:fixed;right:18px;bottom:calc(20px + var(--safe-b));z-index:30;height:56px;padding:0 22px 0 18px;border:0;border-radius:18px;background:var(--acc);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(139,108,255,.45)}
.fab svg{width:22px;height:22px}

/* ---------- sheets / pages ---------- */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:slide .22s ease both}
@keyframes slide{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.page-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg-a);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.page-head h2{margin:0;font-size:19px;flex:1}
.wrap{padding:16px;max-width:760px;margin:0 auto}

/* ---------- add ---------- */
.results{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.res{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;width:100%}
.res img,.res .noimg{width:56px;height:84px;border-radius:8px;object-fit:cover;flex:none;background:var(--bg2)}
.res .rt{font-weight:700;font-size:14.5px;line-height:1.25}
.res .rs{font-size:12.5px;color:var(--mut);margin-top:3px}
.res .in{margin-left:auto;font-size:11px;font-weight:700;color:var(--good);flex:none}
.hint{color:var(--mut);font-size:13px;text-align:center;padding:24px 10px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:30px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.link-btn{background:none;border:0;color:var(--acc);font-weight:600;padding:8px;font-size:14px}

/* ---------- detail ---------- */
.hero{position:relative;padding:70px 16px 18px;overflow:hidden}
.hero .bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3);opacity:.55;transform:scale(1.1)}
.hero .bg.banner{filter:none;opacity:.45;inset:0;transform:none;height:190px}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(11,11,18,.15),var(--bg) 92%)}
.hero-in{position:relative;z-index:2;display:flex;gap:14px;align-items:flex-end;max-width:760px;margin:0 auto}
.hero .cover{width:118px;flex:none;box-shadow:0 14px 34px rgba(0,0,0,.6)}
.hero h2{margin:0;font-size:22px;line-height:1.15}
.hero .alt{color:var(--mut);font-size:12.5px;margin-top:4px}
.back{position:absolute;top:14px;left:14px;z-index:3;color:#fff;background:rgba(0,0,0,.45);border:0;backdrop-filter:blur(6px)}
.more-btn{position:absolute;top:14px;right:14px;z-index:3;color:#fff;background:rgba(0,0,0,.45);border:0;backdrop-filter:blur(6px)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--txt)}
.tag.c{background:var(--c);color:#fff}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.sec h3{margin:0 0 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.sec h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--dim)}
.syn{color:var(--txt);opacity:.9;font-size:14px;white-space:pre-line}
.syn.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;font-size:13px}
.facts div span{display:block;color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:8px 11px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--c,var(--acc));color:#fff;border-color:transparent}
.rating{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.rating button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--bg2);font-weight:800;font-size:13px;color:var(--mut);padding:0}
.rating button.on{color:#1a1200;border-color:transparent}
.rating-label{margin-top:8px;font-size:13px;color:var(--mut);min-height:18px}
.prog{height:10px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--c,var(--acc));border-radius:99px;transition:width .25s}
.prog-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--bg2);border-radius:10px;padding:9px 12px;font-size:13px;font-weight:600}
.btn.pri{background:var(--c,var(--acc));border-color:transparent;color:#fff}
.btn.danger{color:var(--bad)}
.num-in{display:flex;align-items:center;gap:8px}
.num-in input{width:90px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-weight:700;text-align:center}

/* checklist */
.seasons{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.seasons button{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;color:var(--mut)}
.seasons button.on{background:var(--c,var(--acc));color:#fff;border-color:transparent}
.ep{display:flex;align-items:flex-start;gap:11px;padding:10px 2px;border-top:1px solid var(--line);user-select:none;-webkit-user-select:none}
.ep:first-child{border-top:0}
.ep .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--ckb);flex:none;display:grid;place-items:center;margin-top:1px}
.ep.done .ck{background:var(--c,var(--acc));border-color:transparent}
.ep.done .ck::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ep .no{font-weight:800;font-size:12.5px;color:var(--mut);min-width:34px;margin-top:3px}
.ep .et{flex:1;font-size:14px}
.ep .ed{display:block;font-size:11.5px;color:var(--dim);margin-top:1px}
.ep.done .et{color:var(--mut)}
.ep .fl{font-size:10px;font-weight:800;color:var(--warn);border:1px solid rgba(255,181,71,.4);border-radius:5px;padding:0 4px;margin-left:6px}
.list-more{width:100%;margin-top:8px}
.vols{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:7px}
.vol{aspect-ratio:3/4;border-radius:8px;border:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--dim);position:relative;padding:0}
.vol small{font-size:9px;font-weight:700;letter-spacing:.3px}
.vol.own{border-color:var(--good);color:var(--txt)}
.vol.read{background:var(--c,var(--acc));color:#fff;border-color:transparent}
.vol.own.read{box-shadow:inset 0 0 0 2px var(--good)}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* notes */
.note-new textarea,.field textarea,.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical;outline:0}
.note-new textarea{min-height:80px}
.note{border-top:1px solid var(--line);padding:10px 0}
.note .nd{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between}
.note .nd button{background:none;border:0;color:var(--dim);font-size:12px}
.note .nt{white-space:pre-wrap;font-size:14px;margin-top:3px}

/* settings / forms */
.field{margin:12px 0}
.field label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px;font-weight:600}
.cat-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat-pick button{border:1px solid var(--line);background:var(--bg2);border-radius:12px;padding:12px;text-align:left;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-pick button .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cat-pick button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--bg2))}
.prof{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.prof:first-of-type{border-top:0}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--acc);flex:none}

.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);z-index:100;background:#2a2940;border:1px solid #3a3955;color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.5);max-width:92vw}
.toast button{background:none;border:0;color:var(--acc);font-weight:700}
.welcome{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:30px 22px;max-width:520px;margin:0 auto}
.welcome h1{font-size:34px;margin:0 0 6px}
.welcome p{color:var(--mut);margin:0 0 20px}
.big-btn{width:100%;border:0;border-radius:14px;padding:15px;background:var(--acc);color:#fff;font-weight:800;font-size:16px;margin-top:18px}
.menu{position:absolute;right:14px;top:60px;z-index:10;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:200px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 14px;font-size:14px}
.menu button+button{border-top:1px solid var(--line)}
@media (min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.hero .cover{width:150px}}

/* ---------- 3D ring (lazy Susan) ---------- */
.mode-btn{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.mode-btn button{background:var(--card);border:0;padding:9px 10px;color:var(--mut);display:grid;place-items:center}
.mode-btn button.on{background:var(--acc);color:#fff}
.mode-btn svg{width:17px;height:17px}
.ring-wrap{position:relative;padding:6px 0 calc(120px + var(--safe-b));overflow:hidden;touch-action:pan-y}
.ring-glow{position:absolute;left:50%;top:150px;width:520px;height:420px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,var(--gc,#8b6cff) 0%,transparent 70%);opacity:.28;filter:blur(20px);transition:background .5s;pointer-events:none}
.ring-stage{position:relative;height:330px;perspective:900px;perspective-origin:50% 0%;cursor:grab;user-select:none;-webkit-user-select:none}
.ring-stage:active{cursor:grabbing}
.ring{position:absolute;left:50%;top:70px;width:0;height:0;transform-style:preserve-3d}
.rcard{position:absolute;width:140px;height:210px;left:-70px;top:0;border-radius:12px;overflow:hidden;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.55);transform-style:preserve-3d;will-change:transform,opacity}
.rcard img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.rcard .ph{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;font-family:var(--font-display);color:var(--mut)}
.rcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.22),transparent 40%);pointer-events:none}
.rcard .rb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.55)}
.rcard .rb i{display:block;height:100%}
.ring-floor{position:absolute;left:50%;top:268px;width:360px;height:60px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.12),transparent);pointer-events:none}
.ring-info{position:relative;text-align:center;padding:4px 22px 0;min-height:150px}
.ring-info .rt{font-family:var(--font-display);font-size:22px;font-weight:700;line-height:1.2;margin-top:6px}
.ring-info .rs{color:var(--mut);font-size:13px;margin-top:5px}
.ring-info .rk{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#fff}
.ring-info .open{margin-top:14px;border:0;border-radius:12px;padding:11px 22px;font-weight:700;color:#fff}
.ring-hint{text-align:center;color:var(--dim);font-size:12px;margin-top:12px}
.ring-count{text-align:center;color:var(--dim);font-size:12px;margin-top:4px}
@media (prefers-reduced-motion: reduce){.ring-glow{transition:none}}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--bg-a);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--dim);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--txt)}
.nav button.on svg{color:var(--acc)}
.fab{bottom:calc(76px + var(--safe-b))}
.grid{padding-bottom:calc(170px + var(--safe-b))}
.ring-wrap{padding-bottom:calc(150px + var(--safe-b))}
.ghead{grid-column:1/-1;font-family:var(--font-display);font-size:20px;font-weight:700;margin:10px 0 -4px;display:flex;align-items:baseline;gap:8px}
.ghead small{font-family:var(--font-body);font-size:12px;color:var(--dim);font-weight:600}

/* ---------- continue strip / horizontal rows ---------- */
.strip-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 16px 0}
.strip-h h3{margin:0;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--mut)}
.strip-h span{font-size:12px;color:var(--dim)}
.hrow{display:flex;gap:12px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.hrow::-webkit-scrollbar{display:none}
.cont{flex:none;width:250px;display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px;scroll-snap-align:start;cursor:pointer}
.cont .cover{width:58px;flex:none;border-radius:8px}
.cont .ct{font-weight:700;font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cont .cs{font-size:12px;color:var(--mut);margin-top:3px}
.cont .prog{height:6px;margin:7px 0 0}
.cont .plus{margin-top:8px;border:0;border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:800;color:#fff;background:var(--c)}
.mini{flex:none;width:112px;cursor:pointer;scroll-snap-align:start}
.mini .cover{border-radius:9px}
.mini .t{margin-top:6px;font-size:12.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini .s{font-size:11px;color:var(--dim);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- browse ---------- */
.b-filters{padding:0 16px}
.b-label{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim);margin:12px 0 0}
.chips.sm .chip{padding:6px 11px;font-size:12.5px}
.load-more{display:block;margin:4px auto 0;grid-column:1/-1}
.tile .onshelf{position:absolute;bottom:9px;left:6px;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;background:rgba(0,0,0,.7);color:var(--good)}
.fy-sec{margin-top:6px}
.fy-sec .why{font-size:12px;color:var(--dim);padding:2px 16px 0}
.add-row{display:flex;gap:8px;flex-wrap:wrap}
.add-row .btn{flex:1;min-width:110px;padding:12px}
html,body{overflow-x:hidden}
.subbar{flex-wrap:nowrap}
.subbar select{min-width:0;flex:1 1 0;max-width:160px;text-overflow:ellipsis}
#h-sort{flex:0 1 auto;max-width:120px}
@media (max-width:440px){.subbar .count{display:none}}

/* ---------- light mode ---------- */
[data-theme="light"]{--bg:#f6f5fb;--bg2:#eceaf4;--card:#ffffff;--line:#e2e0ec;--txt:#17162a;--mut:#5d5b75;--dim:#8f8da6;--bg-a:rgba(246,245,251,.92);--chip:rgba(23,22,42,.07);--ckb:#b9b7cc;--shadow:rgba(40,30,90,.18);--acc:#7353f0}
[data-theme="light"] .hero .bg{opacity:.35}
[data-theme="light"] .toast{background:#25243a;border-color:#25243a}
[data-theme="light"] .ring-floor{background:radial-gradient(closest-side,rgba(40,30,90,.18),transparent)}
[data-theme="light"] .ring-glow{opacity:.22}
[data-theme="light"] .fab{box-shadow:0 10px 26px rgba(115,83,240,.35)}

/* ---------- updates / release ---------- */
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center}
.bell.spin svg{animation:ring 1s ease-in-out infinite}
@keyframes ring{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}75%{transform:rotate(-14deg)}}
.tile .newb{position:absolute;top:30px;left:6px;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--bad);color:#fff;letter-spacing:.3px}
.rel-row{font-size:14px;padding:7px 0;border-top:1px solid var(--line)}
.rel-row:first-of-type{border-top:0}
.rel-in{font-size:11.5px;font-weight:800;color:var(--c,var(--acc));white-space:nowrap}
.rel-note{font-size:12px;color:var(--dim);margin-top:6px}
.upd{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.upd:first-of-type{border-top:0}
.upd .cover{width:44px;flex:none;border-radius:7px}
.upd .ut{font-weight:700;font-size:14px;line-height:1.25}
.upd .ux{font-size:13px;margin-top:2px}
.upd .us{font-size:11.5px;color:var(--dim);margin-top:2px}
.upd .udot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.prog{position:relative}
.prog .aired{position:absolute;left:0;top:0;bottom:0;background:var(--c,var(--acc));opacity:.28;border-radius:99px}
.prog i{position:relative}

/* per-episode notes + movie time */
.ep .nb{background:none;border:0;padding:4px;color:var(--dim);flex:none;opacity:.75}
.ep .nb svg{width:17px;height:17px}
.ep .nb.has{color:var(--c,var(--acc));opacity:1}
.ep .un{display:block;font-size:12px;color:var(--mut);margin-top:3px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.un-edit{padding:4px 0 12px 35px}
.un-edit textarea{width:100%;min-height:70px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;outline:0;resize:vertical}
.time-in{flex-wrap:wrap}
.time-in input{width:52px!important;padding:9px 4px!important}
.time-in span{color:var(--mut);font-size:13px}
.res .why{font-size:12px;color:var(--c,var(--acc));margin-top:4px;line-height:1.3}
.dym{font-size:13px;color:var(--mut);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:4px 0 6px}
.dym .chip{padding:5px 10px;font-size:12.5px;color:var(--txt)}
#a-dt{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;outline:0;resize:vertical}
.cdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.cdot.big{width:30px;height:30px;border:0;padding:0}
.catrow .cname{background:none;border:0;border-bottom:1px dashed var(--line);padding:2px 0;font-weight:700;width:100%;outline:0}
.catrow .btn{padding:7px 9px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.swatches button.on{border-color:var(--txt);box-shadow:0 0 0 2px var(--bg) inset}
.cat-pick button.on{border-color:var(--c)}

.welcome .logo{width:84px;height:84px;border-radius:22px;box-shadow:0 12px 34px rgba(90,110,255,.35);margin-bottom:18px}
.fab{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#ffffff))}
.r18{font-size:9.5px;font-weight:800;color:#fff;background:var(--bad);border-radius:4px;padding:1px 4px;margin-left:3px}
.wrap-chips{flex-wrap:wrap;overflow:visible}

/* chapter / episode pictures */
.uth{position:relative;width:34px;height:48px;border-radius:5px;overflow:hidden;flex:none;background:var(--bg2);cursor:pointer;margin-top:-2px}
.uth.wide{width:68px;height:40px}
.uth img{width:100%;height:100%;object-fit:cover;display:block}
.uth b{position:absolute;left:0;right:0;bottom:0;font-size:8.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.6);text-align:center}
.sheet-wrap{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;animation:fade .18s ease}
.sheet-wrap.out{opacity:0;transition:opacity .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:640px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:10px 16px calc(18px + var(--safe-b));max-height:88vh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-top{display:flex;gap:14px;align-items:flex-end}
.sh-img{width:110px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;flex:none;background:var(--bg2);box-shadow:0 8px 22px var(--shadow)}
.sh-img.wide{width:170px;aspect-ratio:16/9}
.sh-img img{width:100%;height:100%;object-fit:cover;display:block}
.sh-l{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--c,var(--acc))}
.sh-t{font-family:var(--font-display);font-size:19px;font-weight:700;line-height:1.2;margin-top:3px}
.sh-d{font-size:12.5px;color:var(--mut);margin-top:4px}
.sheet textarea{width:100%;min-height:90px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px;outline:0;resize:vertical;margin-top:6px}
.vols.has-covers{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.vol.cv{aspect-ratio:2/3;overflow:hidden;padding:0;justify-content:flex-end;color:#fff}
.vol.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.vol.cv.own img,.vol.cv.read img{opacity:1}
.vol.cv small,.vol.cv{text-shadow:0 1px 3px rgba(0,0,0,.8)}
.vol.cv{font-size:12px}
.vol .vr{position:absolute;top:4px;right:4px;font-style:normal;font-size:10px;background:var(--c,var(--acc));color:#fff;border-radius:50%;width:16px;height:16px;display:grid;place-items:center;text-shadow:none}
.res-group{font-size:12px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--c);margin:10px 2px -2px}
.chars-off{display:flex;align-items:center;gap:12px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.char{background:none;border:0;padding:0;text-align:center;cursor:pointer}
.char .ci{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;font-family:var(--font-display);font-size:28px;color:var(--mut);box-shadow:0 6px 16px var(--shadow)}
.char .ci img{width:100%;height:100%;object-fit:cover}
.char .cr{position:absolute;top:5px;right:5px;min-width:22px;height:22px;border-radius:7px;font-size:12px;font-weight:800;color:#1a1200;display:grid;place-items:center}
.char .cn{font-weight:700;font-size:12.5px;margin-top:6px;line-height:1.2}
.char .cl{font-size:11px;color:var(--c,var(--acc));font-weight:700;margin-top:2px}
.hid{margin-top:12px}.hid summary{cursor:pointer;color:var(--mut);font-size:13px;margin-bottom:10px}
.cs-name{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:700;outline:0}
.mytake .rating{margin-top:4px}
.char .cf{position:absolute;top:5px;left:6px;font-style:normal;color:#ff5d8f;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.chars.pick .char .ck2{display:none;position:absolute;inset:auto 6px 6px auto;width:24px;height:24px;border-radius:50%;background:var(--c,var(--acc));color:#fff;font-style:normal;font-weight:800;place-items:center}
.chars.pick .char.sel .ck2{display:grid}
.chars.pick .char.sel .ci{outline:3px solid var(--c,var(--acc));outline-offset:-3px}
.chars.pick .char.picked{opacity:.45}
.cmini{width:104px}
.cgrid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));padding:16px 16px 0}
.cgrid .cmini{width:auto}
.ring-wrap .cgrid{padding-bottom:0}
.mini .rate{position:absolute;top:5px;right:5px;font-size:10.5px;font-weight:800;padding:2px 5px;border-radius:6px;color:#1a1200}
.mode-btn button{padding:9px 8px}
.pic-help{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px}
.pic-help .link-btn{padding:4px 0;font-size:13px;text-decoration:none}
.about{margin-top:12px;background:var(--bg2);border-radius:12px;padding:10px 12px}
.about .ab-t{font-size:13.5px;line-height:1.5}
.about .ab-s{font-size:11.5px;color:var(--dim);margin-top:6px}
.about .ab-s .link-btn{padding:0;font-size:11.5px}
.about textarea{width:100%;min-height:80px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;outline:0;resize:vertical;margin-top:6px}
.r-about{font-size:13px;color:var(--mut);line-height:1.45;margin:8px auto 0;max-width:420px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.shelf-chars{margin-top:0;position:relative;z-index:2}
.ring-wrap.tight{padding-bottom:10px}
.shelf-chars .strip-h{padding-top:0}
.ring-wrap.compact{padding-bottom:calc(150px + var(--safe-b))}
.ring-heart{position:absolute;top:6px;left:8px;font-style:normal;color:#ff5d8f;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.6)}

/* ---------- appearance page ---------- */
.look-link{display:flex;align-items:center;gap:12px;cursor:pointer}
.swatch-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pal{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.pal-c{width:100%;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);display:block}
.pal.on .pal-c{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pal-n{font-size:11.5px;color:var(--mut);font-weight:600;text-align:center;line-height:1.2}
.color-row{display:flex;gap:16px}
.color-row label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mut)}
.color-row input{width:46px;height:36px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px}
.font-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.font-opt{background:var(--bg2);border:2px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;cursor:pointer;color:var(--txt)}
.font-opt.on{border-color:var(--acc)}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icon-opt{background:none;border:2px solid transparent;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--mut);cursor:pointer}
.icon-opt img{width:56px;height:56px;border-radius:14px}
.icon-opt.on{border-color:var(--acc)}
html.ombre body{background-attachment:fixed}
html.ombre .top{background:linear-gradient(var(--bg-a) 70%,transparent)}
html.ombre .sec,html.ombre .res,html.ombre .cont{background:color-mix(in srgb,var(--card) 82%,transparent)}

/* ---------- shelf layouts ---------- */
.grid .tile .d{font-size:11.5px;color:var(--mut);margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.grid .tile .g{font-size:11px;color:var(--dim);margin-top:4px}
.grid.gsize-sm{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px 9px}
.grid.gsize-sm .tile .t{font-size:11.5px}
.grid.gsize-lg{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.shelf-covers .tile .tx{display:none}
.grid.shelf-big{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px 14px}
.grid.shelf-big .tile .t{font-size:14.5px}
.grid.shelf-list{grid-template-columns:1fr;gap:10px}
.grid.shelf-list .tile{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.grid.shelf-list .tile .cover{width:78px;flex:none}
.grid.shelf-list.gsize-sm .tile .cover{width:58px}
.grid.shelf-list.gsize-lg .tile .cover{width:104px}
.grid.shelf-list .tile .tx{flex:1;min-width:0}
.grid.shelf-list .tile .t{font-size:15px;margin-top:0}
.grid.shelf-list .tile .d{-webkit-line-clamp:4;font-size:12.5px}
.grid.shelf-list .ghead{margin-top:6px}
.pubb{position:absolute;bottom:22px;left:6px;font-size:9.5px;font-weight:800;padding:2px 5px;border-radius:5px;letter-spacing:.3px;color:#fff}
.pubb.hiatus{background:#c98a00}.pubb.sbreak{background:#2b8fd6}.pubb.cancel{background:#666}
.pub-row{display:flex;align-items:center;gap:8px}
.pub-dot{width:10px;height:10px;border-radius:50%;background:var(--dim);flex:none}
.pub-dot.releasing{background:var(--good)}.pub-dot.hiatus{background:#f2b01e}.pub-dot.season_break{background:#3fa9f5}.pub-dot.finished{background:var(--acc)}.pub-dot.cancelled{background:var(--bad)}
.pub-row .mine{font-size:11px;color:var(--c,var(--acc));font-weight:700}
.pub-src{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px 18px}
.pub-src span{font-size:11.5px;color:var(--mut);background:var(--bg2);border-radius:999px;padding:2px 8px}
.pub-src span.agree{color:var(--txt)}
.pub-set .link-btn{padding:4px 0;font-size:12.5px}
.pub-form{margin-top:6px}
/* cover slideshow */
.cover.carousel{position:relative;cursor:pointer;touch-action:pan-y}
.cover.carousel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s ease, transform 3s ease;transform:scale(1.03)}
.cover.carousel img.on{opacity:1;transform:scale(1)}
.car-cap{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.75));text-align:center;line-height:1.2}
.car-n{position:absolute;top:5px;right:5px;font-size:9.5px;font-weight:800;color:#fff;background:rgba(0,0,0,.55);border-radius:6px;padding:1px 5px}
/* series books */
.brow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.brow:first-of-type{border-top:0}
.bcov{position:relative;width:46px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--bg2);flex:none;display:grid;place-items:center}
.bcov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bcov b{color:var(--dim);font-family:var(--font-display)}
.bcov img + b{display:none}
.brow .bt{font-weight:700;font-size:14px;line-height:1.25}
.brow .bs{font-size:12px;color:var(--mut);margin-top:2px}
.bchip{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--bg2);color:var(--mut);margin-right:5px}
.bchip.done{background:var(--c,var(--acc));color:#fff}.bchip.cur{background:#3fa9f5;color:#fff}.bchip.own{background:var(--good);color:#032}
.ser-ic{display:flex!important;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-display);font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--c,var(--acc)),color-mix(in srgb,var(--c,var(--acc)) 55%,#000))!important}
.ser-ic small{font-family:var(--font-body);font-size:10px;font-weight:700;opacity:.85}
/* browse filters */
.f-sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:4px}
.chip.sm-x{padding:5px 10px;font-size:12px}
.mini-seg button{padding:6px 10px;font-size:12px}
.seg.wrap{flex-wrap:wrap}
.lvl-note{font-size:11.5px;color:var(--dim);margin-top:6px;line-height:1.4}
.lvl-help{cursor:help;text-transform:none}
.fgroup{border-top:1px solid var(--line);margin-top:10px}
.fg-h{width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;padding:10px 0 6px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);cursor:pointer}
.fg-h .fg-n{background:var(--c,var(--acc));color:#fff;border-radius:999px;padding:0 7px;font-size:11px;letter-spacing:0}
.fg-h .fg-a{margin-left:auto;font-size:18px;font-weight:400}
.fgroup .fg-b{display:none;padding-top:2px}
.fgroup.open .fg-b{display:flex}


/* ================= DECOR ================= */
:root{--acc2:#ff7eb3;--shk:1;--bw:1px}
.sec,.res,.cont,.upd{border-width:var(--bw)}
.sec,.res,.cont{box-shadow:0 calc(3px*var(--shk)) calc(12px*var(--shk)) color-mix(in srgb,var(--shadow) calc(40%*var(--shk)),transparent)}
.rad-custom .cover,.rad-custom .rcard,.rad-custom .btn,.rad-custom .res img,.rad-custom .cont .cover{border-radius:calc(var(--r)*.7)!important}
.rad-custom .chip,.rad-custom .seg button{border-radius:calc(var(--r)*.8)}

/* card styles */
html:is(.card-round) :is(.sec,.res,.cont,.upd){border-radius:24px}
html.card-round .cover{border-radius:16px}
html.card-square :is(.sec,.res,.cont,.upd,.btn,.chip,.cover,.rcard,.seg button,input,.sheet){border-radius:2px!important}
html.card-outline :is(.sec,.res,.cont,.upd){background:transparent;border:calc(var(--bw) + 1px) solid var(--txt);box-shadow:none}
html.card-paper :is(.sec,.res,.cont,.upd){box-shadow:2px 3px 0 var(--line),0 6px 16px var(--shadow);background-image:linear-gradient(transparent,rgba(255,255,255,.025))}
html.card-glass :is(.sec,.res,.cont,.upd){background:color-mix(in srgb,var(--card) 55%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-color:rgba(255,255,255,.14)}
html.card-frosted :is(.sec,.res,.cont,.upd){background:color-mix(in srgb,var(--card) 35%,rgba(255,255,255,.12));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-color:rgba(255,255,255,.25)}
html.card-sticker :is(.sec,.res,.cont,.upd){border:3px solid #fff;box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 35%,transparent),0 8px 18px var(--shadow);border-radius:20px}
html[data-theme=dark].card-sticker :is(.sec,.res,.cont,.upd){border-color:color-mix(in srgb,var(--txt) 75%,transparent)}
html.card-bubble :is(.sec,.res,.cont,.upd){border-radius:28px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.06),0 6px 16px var(--shadow)}
html.card-shadow :is(.sec,.res,.cont,.upd){border:2px solid var(--txt);box-shadow:5px 5px 0 var(--txt);border-radius:8px}
html.card-shadow .btn{border:2px solid var(--txt);box-shadow:3px 3px 0 var(--txt)}
html.card-neon :is(.sec,.res,.cont,.upd){border:1.5px solid var(--acc);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 0 10px color-mix(in srgb,var(--acc) 25%,transparent)}
html.card-embossed :is(.sec,.res,.cont,.upd){border:none;background:var(--bg);box-shadow:6px 6px 14px color-mix(in srgb,var(--bg) 70%,#000),-6px -6px 14px color-mix(in srgb,var(--bg) 80%,#fff)}
html.card-notebook :is(.sec,.res,.cont,.upd){background-image:linear-gradient(transparent 23px,color-mix(in srgb,var(--acc) 18%,transparent) 24px);background-size:100% 24px;border-left:3px solid color-mix(in srgb,#e57373 70%,transparent)}
html.card-gradient :is(.sec,.res,.cont,.upd){border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--acc),var(--acc2)) border-box}
html.card-pixel :is(.sec,.res,.cont,.upd){border-radius:0;border:none;box-shadow:0 -4px 0 0 var(--txt),0 4px 0 0 var(--txt),-4px 0 0 0 var(--txt),4px 0 0 0 var(--txt),6px 6px 0 2px color-mix(in srgb,var(--acc) 60%,transparent)}

.pl-stage{font-size:12px;font-weight:800;color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pl-big{position:relative;width:200px;margin:8px auto 6px;cursor:pointer}
.pl-big svg{width:100%;height:auto;display:block}
.pl-big.wig svg{animation:hop .45s ease}
.pl-love{position:absolute;font-style:normal;font-size:18px;animation:heartup 1.1s ease-out forwards;pointer-events:none}
.pl-can{position:absolute;top:0;right:-10px;font-size:40px;opacity:0;transform:rotate(0);transition:.3s;pointer-events:none}
.pl-can.pour{opacity:1;animation:pour 1.3s ease}
@keyframes pour{0%{transform:translate(20px,-10px) rotate(0)}30%,80%{transform:translate(-10px,0) rotate(-40deg)}100%{transform:translate(20px,-10px) rotate(0);opacity:0}}
.pl-prog{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--mut);margin:6px 0 10px}
.pl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 4px;text-align:center}
.pl-stats div{background:var(--bg2);border-radius:12px;padding:8px 2px}.pl-stats b{display:block;font-size:19px}.pl-stats span{font-size:10.5px;color:var(--dim)}
.pl-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px auto 0;max-width:260px}
.pl-cal em{font-style:normal;font-size:10px;color:var(--dim);text-align:center}
.pl-cal i{aspect-ratio:1;border-radius:6px;background:var(--bg2)}
.pl-cal i.w{background:#4fa95a;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.pl-cal i.w::after{content:"💧";display:grid;place-items:center;height:100%;font-size:10px}
.pl-cal i.t{outline:2px solid var(--acc)}.pl-cal i.f{opacity:.3}

/* ---------- appearance page ---------- */
.lk .lk-sec{padding:0;overflow:hidden}
.lk .lk-h{padding:14px;margin:0;cursor:pointer;user-select:none}
.lk .lk-h .r{max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk-ar{margin-left:8px;font-size:18px;color:var(--mut);width:16px;text-align:center}
.lk .lk-b{padding:0 14px 14px}
.lk-sec:not(.open) .lk-b{display:none}
.lk-tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.lk-check{display:flex;gap:9px;align-items:flex-start;font-size:13px;margin:10px 0 4px;color:var(--mut);line-height:1.35}
.lk-check input{width:18px;height:18px;flex:none;accent-color:var(--acc);margin-top:0}
.lk-filter{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.lk-input{width:100%;box-sizing:border-box;font:inherit;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.seg.wrap{flex-wrap:wrap}
.sl{display:grid;grid-template-columns:1fr 2fr auto;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin:10px 0}
.sl input{accent-color:var(--acc);width:100%}.sl b{font-size:12px;min-width:38px;text-align:right;color:var(--txt)}
.preset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.preset{position:relative;text-align:left;border:2px solid transparent;border-radius:14px;padding:12px 12px 10px;min-height:118px;display:flex;flex-direction:column;gap:4px;overflow:hidden;box-shadow:0 3px 10px var(--shadow)}
.preset.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.pv-bar{position:absolute;top:0;left:0;right:0;height:5px}
.pv-t{font-size:16px;margin-top:4px;padding-right:34px;line-height:1.15}
.pv-d{font-size:11.5px;opacity:.75;line-height:1.3;padding-right:30px}
.pv-tiles{display:flex;gap:5px;margin-top:auto;padding-top:6px}.pv-tiles i{width:20px;height:28px;border-radius:4px}
.pv-bud{position:absolute;right:2px;bottom:2px;width:52px;height:52px}.pv-bud svg{width:100%;height:100%}
.pv-x{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;font-size:12px;display:grid;place-items:center}
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card-opt{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mut);background:transparent;border:2px solid transparent;border-radius:12px;padding:6px 2px}
.card-opt.on{border-color:var(--acc);color:var(--txt)}
.card-opt i{width:44px;height:30px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.cs-round i{border-radius:14px}.cs-square i{border-radius:1px}.cs-outline i{background:transparent;border:2px solid var(--txt)}.cs-paper i{box-shadow:2px 2px 0 var(--line)}.cs-glass i{background:color-mix(in srgb,var(--card) 50%,transparent);border-color:rgba(255,255,255,.3)}.cs-frosted i{background:rgba(255,255,255,.2)}
.cs-sticker i{border:3px solid #fff;box-shadow:0 2px 0 var(--acc)}.cs-bubble i{border-radius:16px;box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}.cs-shadow i{border:2px solid var(--txt);box-shadow:3px 3px 0 var(--txt);border-radius:4px}.cs-neon i{border-color:var(--acc);box-shadow:0 0 6px var(--acc)}
.cs-embossed i{border:0;background:var(--bg);box-shadow:3px 3px 6px color-mix(in srgb,var(--bg) 70%,#000),-3px -3px 6px color-mix(in srgb,var(--bg) 80%,#fff)}.cs-notebook i{background-image:linear-gradient(transparent 7px,color-mix(in srgb,var(--acc) 30%,transparent) 8px);background-size:100% 8px;border-left:3px solid #e57373}
.cs-gradient i{border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(135deg,var(--acc),var(--acc2)) border-box}.cs-pixel i{border-radius:0;border:0;box-shadow:0 0 0 3px var(--txt)}.cs-scrapbook i{transform:rotate(-3deg);box-shadow:0 2px 4px var(--shadow)}
.fcol-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fcol{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:11.5px;padding:7px 8px;border-radius:10px;background:var(--bg2);border:2px solid transparent;color:var(--txt)}
.fcol.on{border-color:var(--acc)}.fcol span{display:flex;gap:2px}.fcol i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.bud-hero{display:flex;gap:12px;align-items:center;background:var(--bg2);border-radius:14px;padding:10px;margin-bottom:6px}
.bud-hero-art{width:96px;height:96px;flex:none}.bud-hero-art svg{width:100%;height:100%}
.bud-hero-n{font-family:var(--font-display);font-weight:var(--display-weight);font-size:19px}
.buddy-grid,.coat-grid,.acc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.buddy-opt,.coat,.acc-opt,.plant-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;background:var(--chip);border:2px solid transparent;color:var(--txt);font-size:11px;line-height:1.2;text-align:center}
.buddy-opt svg,.coat svg,.acc-opt svg{width:58px;height:58px}
.buddy-opt.on,.coat.on,.acc-opt.on,.plant-opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--chip))}
.bo-none{height:58px;display:flex;align-items:center;font-size:24px;color:var(--dim)}
.plant-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.plant-opt svg{width:60px;height:70px}
.wall-prev{height:110px;border-radius:12px;background-size:cover;background-position:center;margin:10px 0}
.color-row{flex-wrap:wrap}
</style>
</head>

<script>/* ============ DATA SOURCES (all free, no keys) ============ */
const CATS = {
  anime:  {label:"Anime",  color:"#ff5d8f", unit:"episode", units:"episodes", verb:"Watching", done:"Watched"},
  manga:  {label:"Manga",  color:"#ffb547", unit:"chapter", units:"chapters", verb:"Reading",  done:"Read", vols:true},
  manhwa: {label:"Manhwa", color:"#8b6cff", unit:"chapter", units:"chapters", verb:"Reading",  done:"Read", vols:true},
  manhua: {label:"Manhua", color:"#ff7a45", unit:"chapter", units:"chapters", verb:"Reading",  done:"Read", vols:true},
  tv:     {label:"TV Shows",color:"#3fc1ff", unit:"episode", units:"episodes", verb:"Watching", done:"Watched"},
  movie:  {label:"Movies", color:"#ff4d5e", unit:"movie",   units:"",         verb:"Watching", done:"Watched"},
  book:   {label:"Books",  color:"#3ddc97", unit:"page",    units:"pages",    verb:"Reading",  done:"Read", own:true},
  game:   {label:"Games",  color:"#06d6a0", unit:"game",    units:"",         verb:"Playing",  done:"Played", own:true, game:true},
};
const COUNTRY = {manga:"JP", manhwa:"KR", manhua:"CN"};
function adultOn(){ try{ return !!(data && data.active && data.profiles.find(p=>p.id===data.active)?.adult); }catch(e){ return false; } }
const MDX_RATING = () => "&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica" + (adultOn() ? "&contentRating[]=pornographic" : "");

function stripHtml(h){
  if(!h) return "";
  const d = new DOMParser().parseFromString(String(h).replace(/<br\s*\/?>/gi,"\n"), "text/html");
  return (d.body.textContent||"").replace(/\n{3,}/g,"\n\n").replace(/\(Source:[^)]*\)\s*$/i,"").trim();
}
async function getJSON(url, opts={}, ms=15000){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
  try{
    const r = await fetch(url, {...opts, signal: ctl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function jsonp(url, ms=15000){
  return new Promise((res, rej)=>{
    const cb = "_jp"+Date.now()+Math.floor(Math.random()*1e4);
    const s = document.createElement("script");
    const done = (fn,v)=>{ clearTimeout(t); delete window[cb]; s.remove(); fn(v); };
    const t = setTimeout(()=>done(rej, new Error("timeout")), ms);
    window[cb] = d => done(res, d);
    s.onerror = () => done(rej, new Error("load"));
    s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
    document.head.appendChild(s);
  });
}

/* ---------- AniList: anime, manga, manhwa, manhua ---------- */
const AL_FIELDS = `id idMal isAdult type format status episodes chapters volumes duration countryOfOrigin
  title{romaji english native} synonyms coverImage{extraLarge large color} bannerImage
  description(asHtml:false) startDate{year} endDate{year} genres averageScore
  studios(isMain:true){nodes{name}} staff(perPage:4,sort:RELEVANCE){edges{role node{name{full}}}}
  nextAiringEpisode{episode}`;
async function anilist(query, variables){
  const d = await getJSON("https://graphql.anilist.co", {
    method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify({query, variables})
  });
  if(d.errors) throw new Error(d.errors[0].message);
  return d.data;
}
function fromAniList(m, cat){
  const authors = (m.staff?.edges||[]).filter(e=>/story|art|original/i.test(e.role||"")).map(e=>e.node.name.full);
  const eng = m.title.english, rom = m.title.romaji;
  return {
    cat, src:{al:m.id, mal:m.idMal||null},
    title: eng || rom, alt: [eng && rom !== eng ? rom : null, m.title.native].filter(Boolean).join(" · "), aka: (m.synonyms||[]).slice(0,8),
    cover: m.coverImage?.extraLarge || m.coverImage?.large || "", banner: m.bannerImage || "",
    color: m.coverImage?.color || null,
    synopsis: stripHtml(m.description),
    year: m.startDate?.year || null, genres: m.genres || [],
    meta: {
      format: (m.format||"").replace(/_/g," "), status: (m.status||"").replace(/_/g," "),
      episodes: m.episodes || (m.nextAiringEpisode ? m.nextAiringEpisode.episode-1 : null),
      chapters: m.chapters || null, volumes: m.volumes || null, duration: m.duration || null,
      studio: m.studios?.nodes?.[0]?.name || null, authors: [...new Set(authors)].slice(0,3),
      score: m.averageScore || null, ended: m.endDate?.year || null,
    }
  };
}
async function searchAniList(q, cat){
  const isAnime = cat==="anime";
  const query = `query($s:String,$t:MediaType${isAnime?"":",$c:CountryCode"}){Page(perPage:20){media(search:$s,type:$t${isAnime?"":",countryOfOrigin:$c"},sort:SEARCH_MATCH${adultOn()?"":",isAdult:false"}){${AL_FIELDS}}}}`;
  const vars = {s:q, t: isAnime?"ANIME":"MANGA"}; if(!isAnime) vars.c = COUNTRY[cat];
  const d = await anilist(query, vars);
  return d.Page.media.map(m=>fromAniList(m, cat));
}
async function alByMal(mal, cat){
  const d = await anilist(`query($m:Int,$t:MediaType){Media(idMal:$m,type:$t){${AL_FIELDS}}}`, {m:mal, t: cat==="anime"?"ANIME":"MANGA"});
  return d.Media ? fromAniList(d.Media, cat) : null;
}
async function refreshAniList(item){
  const d = await anilist(`query($id:Int){Media(id:$id){${AL_FIELDS}}}`, {id:item.src.al});
  return fromAniList(d.Media, item.cat);
}

/* ---------- Jikan (MyAnimeList): second source for search ---------- */
function fromJikan(m, cat){
  const yr = m.year || m.aired?.prop?.from?.year || m.published?.prop?.from?.year || null;
  const eng = m.title_english, main = m.title;
  return { cat, src:{mal:m.mal_id}, title: eng || main, alt:[eng && main!==eng ? main : null, m.title_japanese].filter(Boolean).join(" · "),
    aka: (m.title_synonyms||[]).slice(0,8), cover: m.images?.webp?.large_image_url || m.images?.jpg?.large_image_url || "", banner:"",
    synopsis: (m.synopsis||"").replace(/\[Written by MAL Rewrite\]/i,"").trim(), year: yr,
    genres: [...(m.genres||[]), ...(m.themes||[]), ...(m.demographics||[])].map(g=>g.name).slice(0,6),
    meta:{ format: m.type || "", status: (m.status||"").replace("Publishing","RELEASING").replace("Currently Airing","RELEASING").replace("Finished Airing","FINISHED").replace("Finished","FINISHED"),
      episodes: m.episodes || null, chapters: m.chapters || null, volumes: m.volumes || null,
      authors: (m.authors||[]).map(a=>a.name.split(", ").reverse().join(" ")).slice(0,3), studio: m.studios?.[0]?.name || null, score: m.score ? Math.round(m.score*10) : null } };
}
async function searchJikan(q, cat){
  const sfw = adultOn() ? "" : "&sfw=true";
  const url = cat==="anime" ? `https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=15${sfw}` : `https://api.jikan.moe/v4/manga?q=${encodeURIComponent(q)}&limit=15&type=${cat}${sfw}`;
  const d = await getJSON(url, {}, 9000);
  return (d.data||[]).map(m=>fromJikan(m, cat));
}

/* ---------- Jikan (MyAnimeList): anime episode titles ---------- */
async function animeEpisodes(item, onProgress){
  if(!item.src.mal) throw new Error("no MAL id");
  const out = []; let page = 1, last = 1;
  do{
    const d = await getJSON(`https://api.jikan.moe/v4/anime/${item.src.mal}/episodes?page=${page}`);
    (d.data||[]).forEach(e=>out.push({
      k: String(e.mal_id), no: e.mal_id, title: e.title || e.title_romanji || "",
      date: e.aired ? e.aired.slice(0,10) : "", filler: !!e.filler, recap: !!e.recap
    }));
    last = d.pagination?.last_visible_page || 1;
    onProgress && onProgress(page, last);
    page++;
    if(d.pagination?.has_next_page) await sleep(450);
    else break;
  } while(page <= last && page < 60);
  try{ // episode pictures, where MyAnimeList has them
    let p2 = 1, more = true; const imgs = {};
    while(more && p2 <= 12){
      await sleep(450);
      const v = await getJSON(`https://api.jikan.moe/v4/anime/${item.src.mal}/videos/episodes?page=${p2}`);
      (v.data||[]).forEach(e=>{ const u = e.images?.jpg?.image_url; if(u && !/apple-touch|questionmark/.test(u)) imgs[e.mal_id] = u; });
      more = !!v.pagination?.has_next_page; p2++;
    }
    out.forEach(e=>{ if(imgs[e.no]) e.img = imgs[e.no]; });
  }catch(e){}
  return out;
}

/* ---------- MangaDex: chapter titles for manga / manhwa / manhua ---------- */
async function findMangaDexId(item){
  const titles = [item.title, ...(item.alt||"").split(" · ")].filter(Boolean);
  for(const t of titles.slice(0,2)){
    const d = await getJSON(`https://api.mangadex.org/manga?title=${encodeURIComponent(t)}&limit=10${MDX_RATING()}`);
    const list = d.data || [];
    const hit = list.find(m=>String(m.attributes?.links?.al||"")===String(item.src.al)) ||
                list.find(m=>item.src.mal && String(m.attributes?.links?.mal||"")===String(item.src.mal));
    if(hit) return hit.id;
  }
  return null;
}
async function mangaChapters(item, onProgress){
  let id = item.src.mdx || await findMangaDexId(item);
  if(!id) throw new Error("not on MangaDex");
  item.src.mdx = id;
  const map = new Map(); let offset = 0, total = 1;
  while(offset < total && offset < 9900){
    const d = await getJSON(`https://api.mangadex.org/chapter?manga=${id}&translatedLanguage[]=en&order[chapter]=asc&limit=100&offset=${offset}&includeEmptyPages=0${MDX_RATING()}`);
    total = d.total || 0;
    (d.data||[]).forEach(c=>{
      const a = c.attributes; if(a.chapter==null) return;
      const k = String(parseFloat(a.chapter)); const prev = map.get(k);
      if(!prev || (!prev.title && a.title)) map.set(k, {k, no: parseFloat(a.chapter), title: a.title || "", vol: a.volume || "", date: (a.publishAt||"").slice(0,10)});
    });
    offset += 100; onProgress && onProgress(Math.min(offset,total), total);
    if(offset < total) await sleep(250);
  }
  const out = [...map.values()].sort((a,b)=>a.no-b.no);
  if(!out.length) throw new Error("no chapters");
  try{ item.volCovers = await mdxCovers(id); }catch(e){}
  return out;
}

async function mdxCovers(id){
  const map = {}; let offset = 0, total = 1;
  while(offset < total && offset < 500){
    const d = await getJSON(`https://api.mangadex.org/cover?manga[]=${id}&limit=100&offset=${offset}&order[volume]=asc`);
    total = d.total || 0;
    (d.data||[]).forEach(c=>{ const v = c.attributes?.volume; if(v==null || v==="") return; const k = String(parseFloat(v)||v);
      const url = `https://uploads.mangadex.org/covers/${id}/${c.attributes.fileName}.512.jpg`;
      if(!map[k] || c.attributes.locale==="en") map[k] = url; });
    offset += 100;
  }
  return map;
}

  if(cat==="book"){ const isbn = q.replace(/[-\s]/g,""); if(/^(97[89])?\d{9}[\dxX]$/.test(isbn)){ try{ const r = await searchBooksGoogle("isbn:"+isbn); if(r.length) return r; }catch(e){} } return searchBooks(q); }
  const safe = p => p.catch(()=>[]);
  if(!opts.deep){
    let al = []; try{ al = await searchAniList(q, cat); }catch(e){}
    if(al.length >= 5) return mergeResults([["AniList", al]], q);
    const md = await safe(searchMangaDex(q, cat));
    const m = mergeResults([["AniList", al], ["MangaDex", md]], q); if(!m.length && !al.length) throw new Error("no results"); return m.slice(0,30);

  const [al, mal, kt, md] = await Promise.all([ safe(searchAniList(q, cat)), safe(searchJikan(q, cat)), safe(searchKitsu(q, cat)), safe(searchMangaDex(q, cat)) ]);
  return mergeResults([["AniList", al], ["MyAnimeList", mal], ["Kitsu", kt], ["MangaDex", md]], q).slice(0, 30);
}

/* ============ GAMES (Wikipedia + Wikidata, no key needed) ============ */
const WP = "https://en.wikipedia.org/w/api.php";
function fromWikiPage(p){
  const title = (p.title||"").replace(/\s*\((?:\d{4} )?video game\)$/i,"").replace(/\s*\(game\)$/i,"");
  const yr = (p.description||"").match(/\b(19|20)\d{2}\b/);
  return { cat:"game", src:{wp:p.pageid, wd:p.pageprops?.wikibase_item||null, wpt:p.title}, title, alt:"",
    cover: p.original?.source || p.thumbnail?.source || "", banner:"", synopsis: (p.extract||"").trim(),
    year: yr ? +yr[0] : null, genres: [], meta:{format:"Game", blurb:p.description||""} };
}
async function wikiPages(params){
  const d = await getJSON(`${WP}?action=query&format=json&origin=*&prop=pageimages|extracts|pageprops|description&piprop=original|thumbnail&pithumbsize=600&exintro=1&explaintext=1&exsentences=6&exlimit=max&pilimit=max&ppprop=wikibase_item&redirects=1&${params}`);
  return Object.values(d.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));
}
async function searchGames(q){
  const pages = await wikiPages(`generator=search&gsrlimit=20&gsrsearch=${encodeURIComponent(q+" video game")}`);
  return pages.filter(p=>/game|video ?game|gacha|visual novel/i.test(p.description||"") && !/^List of|series$|franchise|soundtrack/i.test(p.title+" "+(p.description||""))).map(fromWikiPage);
}
// Fill in developer, publisher, platforms, genres and release date from Wikidata
async function gameDetails(item){
  const id = item.src?.wd; if(!id) return item;
  const d = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${id}&props=claims&format=json&origin=*`);
  const cl = d.entities?.[id]?.claims || {};
  const ids = p => (cl[p]||[]).map(c=>c.mainsnak?.datavalue?.value?.id).filter(Boolean);
  const want = {P178:"developer",P123:"publisher",P400:"platforms",P136:"genres",P8345:"franchise"};
  const all = [...new Set(Object.keys(want).flatMap(ids))].slice(0,45);
  let labels = {};
  if(all.length){ const L = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${all.join("|")}&props=labels&languages=en&format=json&origin=*`);
    Object.entries(L.entities||{}).forEach(([k,v])=>labels[k]=v.labels?.en?.value); }
  const lab = p => ids(p).map(x=>labels[x]).filter(Boolean);
  const dates = (cl.P577||[]).map(c=>c.mainsnak?.datavalue?.value?.time).filter(Boolean).sort();
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
  item.meta = {...item.meta, developer: lab("P178").slice(0,2).join(", ")||null, publisher: lab("P123").slice(0,2).join(", ")||null,
    platforms: lab("P400").slice(0,8), franchise: lab("P8345")[0]||null};
  const g = lab("P136").map(x=>cap(x.replace(/ video game$/,"").replace(/ game$/,""))); if(g.length) item.genres = g.slice(0,5);
  if(dates[0]) item.year = +dates[0].slice(1,5) || item.year;
  return item;
}
async function browseGames({genre, sort="popular", page=1}){
  const label = GAME_GENRE_WD[genre] || null;
  const order = sort==="new" ? "DESC(?date)" : sort==="az" ? "ASC(?name)" : "DESC(?links)";
  const q = `SELECT ?g ?name ?article ?links (MAX(?d) AS ?date) WHERE {
    ?g wdt:P31 wd:Q7889; wikibase:sitelinks ?links.
    ${label ? `?g wdt:P136 ?genre. ?genre rdfs:label "${label}"@en.` : ""}
    ?article schema:about ?g; schema:isPartOf <https://en.wikipedia.org/>; schema:name ?name.
    OPTIONAL { ?g wdt:P577 ?d. }
    ${label ? "" : "FILTER(?links > 60)"}
  } GROUP BY ?g ?name ?article ?links ORDER BY ${order} LIMIT 30 OFFSET ${(page-1)*30}`;
  const d = await getJSON(`https://query.wikidata.org/sparql?format=json&query=${encodeURIComponent(q)}`, {headers:{Accept:"application/sparql-results+json"}}, 20000);
  const rows = d.results?.bindings || [];
  if(!rows.length) return {items:[], more:false};
  const titles = rows.map(r=>r.name.value);
  const pages = await wikiPages(`titles=${encodeURIComponent(titles.join("|"))}`);
  const byT = Object.fromEntries(pages.map(p=>[p.title,p]));
  const items = rows.map(r=>{ const p = byT[r.name.value]; if(!p) return null; const it = fromWikiPage(p); if(r.date) it.year = +r.date.value.slice(0,4) || it.year; if(genre) it.genres=[genre]; return it; }).filter(x=>x && x.cover);
  return {items, more: rows.length===30};
}

const KITSU_SUB = {manga:["manga","oneshot"], manhwa:["manhwa"], manhua:["manhua"]};
function fromKitsu(m, cat){

  return { cat, src:{kitsu:m.id}, title: a.titles?.en || a.titles?.en_us || a.canonicalTitle, alt: [a.canonicalTitle, a.titles?.ja_jp, a.titles?.ko_kr, a.titles?.zh_cn].filter((x,i,arr)=>x && arr.indexOf(x)===i).join(" · "),
    aka: a.abbreviatedTitles||[], cover: a.posterImage?.large || a.posterImage?.medium || "", banner: a.coverImage?.large || "", synopsis: (a.synopsis||"").replace(/\(Source:[^)]*\)/i,"").trim(),
    year: a.startDate ? +a.startDate.slice(0,4) : null, genres: [],
    meta:{ format: (a.subtype||"").toUpperCase(), status: st, episodes: a.episodeCount||null, chapters: a.chapterCount||null, volumes: a.volumeCount||null, score: a.averageRating ? Math.round(+a.averageRating) : null } };
}
async function searchKitsu(q, cat){
  const kind = cat==="anime" ? "anime" : "manga";
  const d = await getJSON(`${KITSU}/${kind}?filter[text]=${encodeURIComponent(q)}&page[limit]=12`, {headers:{Accept:"application/vnd.api+json"}}, 9000);
  return (d.data||[]).filter(m=> cat==="anime" || (KITSU_SUB[cat]||[]).includes(m.attributes?.subtype) || (cat==="manga" && !["manhwa","manhua","novel"].includes(m.attributes?.subtype)))
    .filter(m=> adultOn() || !m.attributes?.nsfw).map(m=>fromKitsu(m, cat));
}
const MDX_LANG = {manga:["ja"], manhwa:["ko"], manhua:["zh","zh-hk"]};
function fromMangaDex(m, cat){
  const a = m.attributes || {}; const t = a.title || {};
  const alts = (a.altTitles||[]).map(o=>Object.values(o)[0]);
  const en = t.en || alts.find(x=>/^[\x00-\x7f]+$/.test(x)) || Object.values(t)[0];
  const cov = (m.relationships||[]).find(r=>r.type==="cover_art")?.attributes?.fileName;
  const st = {ongoing:"RELEASING", completed:"FINISHED", hiatus:"HIATUS", cancelled:"CANCELLED"}[a.status] || "";
  return { cat, src:{mdx:m.id, al: a.links?.al ? +a.links.al : null, mal: a.links?.mal ? +a.links.mal : null}, title: en, alt: [Object.values(t)[0]!==en?Object.values(t)[0]:null].filter(Boolean).join(" · "), aka: alts.slice(0,8),
    cover: cov ? `https://uploads.mangadex.org/covers/${m.id}/${cov}.512.jpg` : "", banner:"", synopsis: (a.description?.en||"").replace(/\n---[\s\S]*$/,"").replace(/\[([^\]]+)\]\([^)]+\)/g,"$1").trim(),
    year: a.year || null, genres: (a.tags||[]).filter(x=>x.attributes?.group==="genre"||x.attributes?.group==="theme").map(x=>x.attributes?.name?.en).filter(Boolean).slice(0,6),
    meta:{ format: cat==="manhwa"?"Manhwa":cat==="manhua"?"Manhua":"Manga", status: st, chapters: a.lastChapter && st==="FINISHED" ? parseFloat(a.lastChapter)||null : null, volumes: a.lastVolume && st==="FINISHED" ? parseFloat(a.lastVolume)||null : null } };
}
async function searchMangaDex(q, cat){
  if(!MDX_LANG[cat]) return [];
  const langs = MDX_LANG[cat].map(l=>`&originalLanguage[]=${l}`).join("");
  const d = await getJSON(`https://api.mangadex.org/manga?title=${encodeURIComponent(q)}&limit=12&includes[]=cover_art&order[relevance]=desc${langs}${MDX_RATING()}`, {}, 9000);
  return (d.data||[]).map(m=>fromMangaDex(m, cat));
}
// Merge results from several sites, matching the same series by shared ids or near-identical titles
function mergeResults(lists, q){
  const out = [];
  const same = (a, b) => (a.src.al && a.src.al===b.src.al) || (a.src.mal && a.src.mal===b.src.mal) || (a.src.mdx && a.src.mdx===b.src.mdx) || (a.src.kitsu && a.src.kitsu===b.src.kitsu)
    || ([a.title, ...(a.alt||"").split(" · "), ...(a.aka||[])].some(t=>t && similar(t, b) > 0.92) && (!a.year || !b.year || Math.abs(a.year-b.year)<=1));
  for(const [label, list] of lists){
    for(const r of list){
      const hit = out.find(o=>same(o, r));
      if(hit){
        hit.src = {...r.src, ...hit.src}; if(!hit.src.mdx && r.src.mdx) hit.src.mdx = r.src.mdx;
        ["cover","banner","synopsis","year"].forEach(k=>{ if(!hit[k] && r[k]) hit[k] = r[k]; });
        if(!hit.genres?.length && r.genres?.length) hit.genres = r.genres;
        hit.aka = [...new Set([...(hit.aka||[]), ...(r.aka||[])])].slice(0,12);
        Object.entries(r.meta||{}).forEach(([k,v])=>{ if((hit.meta[k]==null || hit.meta[k]==="") && v!=null && v!=="") hit.meta[k] = v; });
        if(!hit._sites.includes(label)) hit._sites.push(label);
      } else out.push({...r, meta:{...(r.meta||{})}, _sites:[label]});
    }
  }
  out.forEach(r=>{ r._from = r._sites.length>1 ? `found on ${r._sites.length} sites` : (r._sites[0]==="AniList" ? "" : r._sites[0]); });
  const s = r => similar(q, r) + r._sites.length*0.08;
  return out.sort((a,b)=>s(b)-s(a));
}

/* ============ PUBLICATION STATUS (cross-checked) ============ */
const STATUS_NAMES = {RELEASING:"Releasing", FINISHED:"Finished", HIATUS:"On hiatus", CANCELLED:"Cancelled", "NOT YET RELEASED":"Not out yet", SEASON_BREAK:"Season break"};
function normStatus(s){
  s = String(s||"").toUpperCase();
  if(/HIATUS/.test(s)) return "HIATUS";
  if(/CANCEL|DISCONTINU/.test(s)) return "CANCELLED";
  if(/NOT YET|UPCOMING|TBA|UNRELEASED/.test(s)) return "NOT YET RELEASED";
  if(/FINISH|COMPLETE|ENDED/.test(s)) return "FINISHED";
  if(/RELEAS|ONGOING|PUBLISHING|AIRING|CURRENT|RUNNING/.test(s)) return "RELEASING";
  return "";
}
async function mdxRecent(id){
  const d = await getJSON(`https://api.mangadex.org/chapter?manga=${id}&translatedLanguage[]=en&order[readableAt]=desc&limit=40${MDX_RATING()}`);
  return (d.data||[]).map(c=>({no:parseFloat(c.attributes.chapter), title:c.attributes.title||"", vol:c.attributes.volume||"", at:Date.parse(c.attributes.readableAt||c.attributes.publishAt||"")||0})).filter(c=>!isNaN(c.no));
}
// Looks at several sites and the chapter history to say: releasing, hiatus, season break, finished or cancelled
async function pubStatus(item){
  const srcs = {}; const notes = [];
  const jobs = [];
  if(item.src?.al) jobs.push(anilist(`query($id:Int){Media(id:$id){status}}`, {id:item.src.al}).then(d=>{ if(d.Media?.status) srcs.AniList = normStatus(d.Media.status); }).catch(()=>{}));
  if(item.src?.mal && isAL(item.cat)) jobs.push(getJSON(`https://api.jikan.moe/v4/${item.cat==="anime"?"anime":"manga"}/${item.src.mal}`).then(d=>{ if(d.data?.status) srcs.MyAnimeList = normStatus(d.data.status); }).catch(()=>{}));
  if(item.src?.kitsu) jobs.push(getJSON(`${KITSU}/${item.cat==="anime"?"anime":"manga"}/${item.src.kitsu}`, {headers:{Accept:"application/vnd.api+json"}}).then(d=>{ const s = normStatus(d.data?.attributes?.status==="current"?"RELEASING":d.data?.attributes?.status); if(s) srcs.Kitsu = s; }).catch(()=>{}));
  let recent = [];
  if(C2vols(item.cat)){
    jobs.push((async()=>{ const id = item.src?.mdx || await findMangaDexId(item).catch(()=>null); if(!id) return; item.src.mdx = id;
      const m = await getJSON(`https://api.mangadex.org/manga/${id}`).catch(()=>null); const s = normStatus(m?.data?.attributes?.status); if(s) srcs.MangaDex = s;
      recent = await mdxRecent(id).catch(()=>[]); })());
  }
  await Promise.all(jobs);
  const vals = Object.values(srcs).filter(Boolean);
  let status = "";
  if(vals.includes("HIATUS")) status = "HIATUS";
  else if(vals.includes("CANCELLED") && vals.filter(v=>v==="CANCELLED").length >= Math.max(1, vals.length/2)) status = "CANCELLED";
  else if(vals.length && vals.every(v=>v==="FINISHED")) status = "FINISHED";
  else if(vals.includes("RELEASING")) status = "RELEASING";
  else status = vals[0] || "";
  // Seasons: look for "Season 2", "S2", "Season 1 Finale" etc. in recent chapter titles
  let season = null, seasonEnded = false, lastAt = 0;
  if(recent.length){
    const byNo = recent.slice().sort((a,b)=>b.no-a.no); lastAt = Math.max(...recent.map(c=>c.at));
    for(const c of byNo){ const m = c.title.match(/season\s*(\d+)|\bS(\d+)\b/i); if(m){ season = +(m[1]||m[2]); break; } }
    const top = byNo[0]; if(/(season\s*\d*\s*)?(finale|end\b|ending|final chapter of season)/i.test(top?.title||"")){ seasonEnded = true; const m = top.title.match(/season\s*(\d+)/i); if(m) season = +m[1]; }
  }
  const gapDays = lastAt ? Math.round((Date.now()-lastAt)/86400e3) : null;
  if(status==="RELEASING" && seasonEnded){ status = "SEASON_BREAK"; notes.push(`Season ${season||""} ended`.replace("  "," ")); }
  else if(status==="RELEASING" && gapDays!=null && gapDays > 45) notes.push(`No new English chapter in ${gapDays>90?Math.round(gapDays/30)+" months":Math.round(gapDays/7)+" weeks"}`);
  return {status, season, seasonEnded, gapDays, sources:srcs, notes, checked:Date.now()};
}
function C2vols(cat){ return ["manga","manhwa","manhua"].includes(cat); }

/* ============ BOOK SERIES (Wikidata + Open Library covers) ============ */
const WDQ = q => getJSON(`https://query.wikidata.org/sparql?format=json&query=${encodeURIComponent(q)}`, {headers:{Accept:"application/sparql-results+json"}}, 20000);
async function findBookSeries(q){
  const s = await getJSON(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(q)}&language=en&type=item&limit=10&format=json&origin=*`);
  const ids = (s.search||[]).map(x=>x.id); if(!ids.length) return [];
  const desc = Object.fromEntries((s.search||[]).map(x=>[x.id, {label:x.label, d:x.description||""}]));
  const r = await WDQ(`SELECT ?s (COUNT(DISTINCT ?b) AS ?n) (SAMPLE(?aLabel) AS ?author) WHERE { VALUES ?s { ${ids.map(i=>"wd:"+i).join(" ")} } ?b wdt:P179 ?s; wdt:P50 ?a. ?a rdfs:label ?aLabel. FILTER(LANG(?aLabel)="en") } GROUP BY ?s HAVING(COUNT(DISTINCT ?b) >= 2)`);
  return (r.results?.bindings||[]).map(b=>{ const id = b.s.value.split("/").pop(); return {wd:id, title:desc[id]?.label||q, about:desc[id]?.d||"", count:+b.n.value, author:b.author?.value||""}; })
    .sort((a,b)=>ids.indexOf(a.wd)-ids.indexOf(b.wd));
}
async function seriesBooks(wd){
  const r = await WDQ(`SELECT ?b ?bLabel (SAMPLE(?ord) AS ?o) (MIN(?date) AS ?d) (SAMPLE(?isbn) AS ?i) (SAMPLE(?aLabel) AS ?au) (SAMPLE(?pages) AS ?pg) WHERE {
    ?b p:P179 ?st. ?st ps:P179 wd:${wd}. OPTIONAL { ?st pq:P1545 ?ord. } ?b wdt:P50 ?a. ?a rdfs:label ?aLabel. FILTER(LANG(?aLabel)="en")
    OPTIONAL { ?b wdt:P577 ?date. } OPTIONAL { ?b wdt:P212 ?isbn. } OPTIONAL { ?b wdt:P1104 ?pages. }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "en". } } GROUP BY ?b ?bLabel`);
  const books = (r.results?.bindings||[]).map(x=>({id:x.b.value.split("/").pop(), title:x.bLabel.value, n: x.o ? parseFloat(x.o.value) : null, year: x.d ? +x.d.value.slice(0,4) : null, isbn: x.i ? x.i.value.replace(/-/g,"") : null, author: x.au?.value||"", pages: x.pg ? +x.pg.value : null}))
    .filter(b=>!/^Q\d+$/.test(b.title));
  books.sort((a,b)=>(a.n??999)-(b.n??999) || (a.year||9999)-(b.year||9999));
  books.forEach((b,i)=>{ if(b.n==null) b.n = i+1; });
  return books;
}
async function bookCover(b){
  if(b.isbn) return `https://covers.openlibrary.org/b/isbn/${b.isbn}-L.jpg?default=false`;
  try{ const d = await getJSON(`https://openlibrary.org/search.json?title=${encodeURIComponent(b.title)}&author=${encodeURIComponent(b.author||"")}&limit=3&fields=cover_i,number_of_pages_median,key`);
    const doc = (d.docs||[]).find(x=>x.cover_i); if(doc){ if(!b.pages && doc.number_of_pages_median) b.pages = doc.number_of_pages_median; b.ol = doc.key; return `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`; } }catch(e){}
  return "";
}
async function buildSeries(s){
  const books = await seriesBooks(s.wd);
  await Promise.all(books.map(async(b,i)=>{ await sleep(i*120); b.cover = await bookCover(b); }));
  let synopsis = "";
  try{ const e = await getJSON(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${s.wd}&props=sitelinks&sitefilter=enwiki&format=json&origin=*`);
    const t = e.entities?.[s.wd]?.sitelinks?.enwiki?.title; if(t){ const p = await wikiPages(`titles=${encodeURIComponent(t)}`); synopsis = p[0]?.extract || ""; } }catch(e){}
  return { cat:"book", isSeries:true, src:{wds:s.wd}, title:s.title, alt: s.author || books[0]?.author || "", cover: books.find(b=>b.cover)?.cover || "", banner:"", synopsis,
    year: books.find(b=>b.year)?.year || null, genres:[], meta:{format:"Series", authors:[s.author || books[0]?.author].filter(Boolean), books: books.length}, books };
}

    it.title = title; it.cover = coverData; delete it.cover2; it.year = +$("#m-year",pg).value || null; it.synopsis = $("#m-syn",pg).value.trim();
    it.meta = it.meta || {};
    if(cat==="book" || C(cat).track==="pages") it.meta.pages = tot; else if(cat==="movie" || C(cat).track==="once") it.meta.runtime = cat==="movie" ? tot : null;
    else if(C(cat).unit==="episode"){ it.meta.episodes = tot; } else { it.meta.chapters = tot; }
    if(!it.src?.al && !it.src?.tvm) it.manualTotal = tot;
    lib()[it.id] = it; touch(it);
    history.replaceState(null,"","#item/"+it.id); route(); if(!ed) toast("Added to your shelf");
  };

function shrinkImage(file){
  return new Promise(res=>{
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = ()=>{ const w = 400, h = Math.round(img.height*(w/img.width)); const cv = document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); URL.revokeObjectURL(url); res(cv.toDataURL("image/jpeg",.82)); };
    img.onerror = ()=>res(""); img.src = url;
  });
}

async function downloadBackup(){
  const u = {}; for(const k of await DB.keys()) if(String(k).startsWith("units:")) u[k] = await DB.get(k);
  const blob = new Blob([JSON.stringify({app:"shelf", v:1, at:new Date().toISOString(), data, units:u})], {type:"application/json"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `shelf-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); toast("Backup saved to your Downloads");
}
async function restoreFile(f){
  if(!f) return;
  try{
    const j = JSON.parse(await f.text()); if(j.app!=="shelf" || !j.data?.profiles) throw 0;
    data = j.data; await saveNow();
    for(const [k,v] of Object.entries(j.units||{})) await DB.set(k, v);
    Object.keys(units).forEach(k=>delete units[k]);
    toast("Shelf restored ✓"); go("");
  }catch(e){ toast("That file isn't a shelf backup"); }
}

async function loadBrowse(page){
  const want = JSON.stringify([bstate.cat,bstate.genre,bstate.tag,bstate.sort]);
  bstate.loading = true; bstate.err=""; if(page===1) bstate.items=[]; drawBrowse();

    if(want !== JSON.stringify([bstate.cat,bstate.genre,bstate.tag,bstate.sort])) return;
    bstate.items = page===1 ? r.items : bstate.items.concat(r.items); bstate.more = r.more; bstate.page = page;
  }catch(e){ bstate.err = "Couldn't load this right now. Check your connection and try again."; }
  bstate.loading = false; drawBrowse();
}

  }

async function buildForYou(){
  const body = $("#f-body"); if(!body) return;
  body.innerHTML = `<div class="spinner"></div><div class="hint" style="padding-top:0">Finding things you'll like…</div>`;
  const p = prof(); const items = Object.values(lib()).filter(i=>p.cats.includes(i.cat));
  const liked = items.filter(i=>i.my.rating>=7 || (i.my.status==="completed" && !i.my.rating) || (i.my.status==="current" && !i.my.rating))
                     .sort((a,b)=>(b.my.rating||6)-(a.my.rating||6) || b.updated-a.updated);
  const sections = [];
  // AniList-based recommendations
  const alSeeds = liked.filter(i=>i.src?.al || (window.DEMO_CATALOG && isAL(i.cat))).slice(0,8);
  const recs = new Map();
  for(const seed of alSeeds){
    try{
      const list = await alRecs(seed);
      list.forEach(r=>{ if(findExisting(r) || !p.cats.includes(r.cat)) return; const key = r.src.al || r.title;
        const cur = recs.get(key) || {r, score:0, why:[]}; cur.score += (seed.my.rating||6) + Math.min(5,(r._score||0)/20); if(cur.why.length<2) cur.why.push(seed.title); recs.set(key, cur); });
      await sleep(250);
    }catch(e){}
  }
  const byCat = {};
  [...recs.values()].sort((a,b)=>b.score-a.score).forEach(x=>{ (byCat[x.r.cat] ||= []).push(x); });
  Object.entries(byCat).forEach(([cat,list])=>sections.push({title:`${C(cat).label} picked for you`, cat, items:list.slice(0,15).map(x=>({r:x.r, why:"Because you liked "+x.why[0]}))}));
  // Genre-based for TV, movies, books
  for(const cat of ["tv","movie","book"]){
    if(!p.cats.includes(cat)) continue;
    const mine = liked.filter(i=>i.cat===cat);
    const count = {}; mine.forEach(i=>(i.genres||[]).forEach(g=>count[g]=(count[g]||0)+(i.my.rating||6)));
    const fav = Object.entries(count).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).filter(g=>genreSet(cat).some(G=>G.toLowerCase()===g.toLowerCase()||g.toLowerCase().includes(G.toLowerCase().split(" ")[0])));
    const g = fav[0] ? genreSet(cat).find(G=>G.toLowerCase()===fav[0].toLowerCase()||fav[0].toLowerCase().includes(G.toLowerCase().split(" ")[0])) : null;
    try{
      const r = await browse(cat, {genre:g||"", sort: SORTS[cat][0][0]});
      const list = r.items.filter(x=>!findExisting(x)).slice(0,15);
      if(list.length) sections.push({title: g ? `${C(cat).label}: more ${g}` : `Popular ${C(cat).label.toLowerCase()}`, cat, items:list.map(x=>({r:x, why: g?"You like "+g:""}))});
    }catch(e){}
  }
  // If nothing liked yet, show popular picks for AniList categories
  for(const cat of p.cats.filter(isAL)){
    if(sections.some(s=>s.cat===cat)) continue;
    try{ const r = await browse(cat, {sort:"TRENDING_DESC"}); const list = r.items.filter(x=>!findExisting(x)).slice(0,15);
      if(list.length) sections.push({title:`Trending ${C(cat).label.toLowerCase()}`, cat, items:list.map(x=>({r:x, why:""}))}); }catch(e){}
  }
  fyCache = {profile:data.active, sections, empty: !liked.length};
  drawForYou();
}
function drawForYou(){

/* ============ RELEASE TRACKING + UPDATES ============ */
const S = () => (data.settings ||= {theme:"dark", notify:false, lastCheck:{}});
const UPD = () => ((data.updates ||= {})[data.active] ||= []);
const FOL = () => (((data.follow ||= {})[data.active]) ||= {authors:{}});
function autoFollow(it){ if(!isPages(it)) return; const a = (it.meta?.authors||[])[0]; if(a && !FOL().authors[a]) FOL().authors[a] = {on:true}; }
function maxDoneNo(it){ const ks = Object.keys(it.my.done||{}).map(parseFloat).filter(n=>!isNaN(n)); return ks.length ? Math.max(...ks) : (it.my.count||0); }
function behind(it){
  const t = it.track; if(!t || !/RELEASING|Running|NOT YET/i.test(it.meta?.status||"")) return 0;
  if(it.cat==="anime" && t.aired!=null) return Math.max(0, t.aired - (it.unitsTotal ? Object.keys(it.my.done).length : (it.my.count||0)));
  if(C(it.cat)?.vols && t.latest!=null) return Math.max(0, Math.floor(t.latest) - Math.floor(maxDoneNo(it)));
  if(it.cat==="tv" && t.airedCount!=null) return Math.max(0, t.airedCount - Object.keys(it.my.done||{}).length);
  return 0;
}
function relTime(ms){
  const d = ms - Date.now(), a = Math.abs(d), m = 60e3, h = 60*m, D = 24*h;
  const s = a < h ? Math.round(a/m)+" min" : a < D ? Math.round(a/h)+" hr" : Math.round(a/D)+" day" + (Math.round(a/D)===1?"":"s");
  return d >= 0 ? "in " + s : s + " ago";
}
const fmtWhen = ms => new Date(ms).toLocaleString(undefined,{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
function setBell(){
  const n = UPD().filter(u=>!u.seen).length; const d = $("#h-dot");
  if(d){ d.classList.toggle("hidden", !n); d.textContent = n>9 ? "9+" : n; }
  const b = $("#h-bell"); if(b) b.classList.toggle("spin", checking);
}
async function extendUnits(it, upto){
  if(!upto) return; let L = await loadUnits(it); if(!L) return;
  const max = L.length ? Math.max(...L.map(x=>x.no)) : 0;
  if(upto <= max) return;
  L = L.concat(Array.from({length: upto-max}, (_,i)=>({k:String(max+i+1), no:max+i+1, title:"", date:""})));
  units[it.id] = L; it.unitsTotal = L.length; await DB.set("units:"+it.id, {at:Date.now(), list:L});
}
let checking = false;
async function checkUpdates(force){
  if(checking || !data?.profiles?.length) return;
  const st = S(); st.lastCheck ||= {};
  if(!force && Date.now() - (st.lastCheck[data.active]||0) < 3*3600e3) return;
  checking = true; setBell();
  const p = prof(), pid = data.active, fresh = [];
  const mk = (it, text, extra={}) => ({id:uid(), at:Date.now(), item:it?.id||null, cat:it?.cat||"book", title:it?.title||"", cover:it?.cover||"", text, seen:false, ...extra, ...(window.DEMO_CATALOG?{src:"Sample data (preview)"}:{})});
  const tracked = Object.values(lib()).filter(i=>p.cats.includes(i.cat) && (["current","planned","paused"].includes(i.my.status) || /RELEASING|Running|NOT YET/i.test(i.meta?.status||"")));
  // Anime + manga status (AniList)
  const alItems = tracked.filter(i=>i.src?.al);
  if(alItems.length){
    try{
      const t = await alTrack(alItems.map(i=>i.src.al));
      for(const it of alItems){
        const r = t[it.src.al]; if(!r) continue; const tr = (it.track ||= {});
        if(r.status) it.meta.status = r.status.replace(/_/g," ");
        if(it.cat==="anime"){
          const prev = tr.aired; if(r.aired!=null) tr.aired = r.aired; tr.nextEp = r.nextEp; tr.nextAt = r.nextAt; if(r.total){ tr.total = r.total; it.meta.episodes = r.total; }
          if(prev!=null && tr.aired>prev && it.my.status!=="dropped") fresh.push(mk(it, tr.aired-prev>1 ? `Episodes ${prev+1}–${tr.aired} are out` : `Episode ${tr.aired} is out`, {src:"AniList airing schedule"}));
          if(tr.aired) await extendUnits(it, tr.aired);
        } else { if(r.chapters) it.meta.chapters = r.chapters; if(r.volumes) it.meta.volumes = r.volumes; }
        tr.checked = Date.now();
      }
    }catch(e){}
  }
  // New chapters (MangaDex, English)
  for(const it of tracked.filter(i=>C(i.cat)?.vols && !(/FINISHED/i.test(i.meta?.status||"") && i.track?.latest!=null))){
    try{
      const L = await mdxLatest(it); const tr = (it.track ||= {}); tr.checked = Date.now();
      if(L){ const prev = tr.latest; tr.latest = L.no; tr.latestAt = L.at; tr.latestTitle = L.title;
        if(prev!=null && L.no>prev) fresh.push(mk(it, `Chapter ${L.no} is out in English${L.title?": "+L.title:""}`, {src:"MangaDex"}));
        const Ls = units[it.id]; if(Ls && L.no > Math.max(...Ls.map(x=>x.no))) { try{ const nl = await fetchUnits(it); if(nl?.length){ units[it.id]=nl; it.unitsTotal=nl.length; await DB.set("units:"+it.id,{at:Date.now(),list:nl}); } }catch(e){} }
      }
    }catch(e){}
    await sleep(300);
  }
  // TV episodes (TVmaze)
  for(const it of tracked.filter(i=>i.cat==="tv" && i.src?.tvm)){
    try{
      const r = await tvTrack(it); if(!r) continue; const tr = (it.track ||= {}); const prevK = tr.prev?.k;
      tr.prev = r.prev; tr.next = r.next; tr.checked = Date.now(); if(r.status) it.meta.status = r.status;
      let L = await loadUnits(it);
      if(r.prev && (!L || !L.some(x=>x.k===r.prev.k))){ try{ L = await tvEpisodes(it); units[it.id]=L; it.unitsTotal=L.length; await DB.set("units:"+it.id,{at:Date.now(),list:L}); }catch(e){} }
      if(L){ const today = new Date().toISOString().slice(0,10); tr.airedCount = L.filter(x=>x.date && x.date<=today).length; }
      if(prevK && r.prev && r.prev.k!==prevK) fresh.push(mk(it, `S${r.prev.season} E${r.prev.no}${r.prev.title?` “${r.prev.title}”`:""} aired`, {src:"TVmaze"}));
    }catch(e){}
    await sleep(200);
  }
  // New books from followed authors (Google Books)
  if(p.cats.includes("book")){
    for(const [name, f] of Object.entries(FOL().authors)){
      if(!f.on) continue;
      try{
        const list = await authorBooks(name); const ids = list.map(b=>b.src.gb||b.title);
        if(!f.seen){ f.seen = ids; continue; }   // first check just learns what already exists
        for(const b of list){
          const k = b.src.gb||b.title; if(f.seen.includes(k)) continue; f.seen.push(k);
          if(findExisting(b)) continue;
          const yr = b.year, soon = b.year && b.year > new Date().getFullYear();
          if(yr && yr < new Date().getFullYear()-1) continue;
          fresh.push(mk(null, `${soon?"Coming soon":"New"} from ${name}: ${b.title}${yr?` (${yr})`:""}`, {title:b.title, cover:b.cover, cover2:b.cover2, r:b, src:"Google Books"}));
        }
      }catch(e){}
      await sleep(200);
    }
  }
  if(data.active===pid){
    if(fresh.length){ UPD().unshift(...fresh); if(UPD().length>200) UPD().length = 200; }
    st.lastCheck[pid] = Date.now(); save();
  }
  checking = false; setBell();
  if(fresh.length){ notifyPhone(fresh); if(curMain==="home" && !document.querySelector(".page")) drawGrid(); toast(fresh.length===1 ? fresh[0].title+": "+fresh[0].text : fresh.length+" new updates"); }
  if(location.hash==="#updates") route();
}
